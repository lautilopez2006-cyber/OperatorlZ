/* ===== Almacenamiento: db compartido en la nube con respaldo local ===== */
const COLS=['monsters','characters','npcs','maps','manuals','feats','sessions'];
const Store={
 mode:'local',db:null,assets:null,downloads:null,data:{},docs:{},pending:new Set(),subs:new Set(),firstCloud:{},
 init(){
  for(const c of COLS) this.data[c]=lsGet('oz:'+c,{});
  this.docs.combat=lsGet('oz:doc:combat',null); this.docs.settings=lsGet('oz:doc:settings',{});
  this.connect();
 },
 async connect(){
  if(!window.claude||!claude.use) { this.setMode('local'); return; }
  try{
   const [db,assets,downloads]=await Promise.all([claude.use('db'),claude.use('assets').catch(()=>null),claude.use('downloads').catch(()=>null)]);
   this.assets=assets; this.downloads=downloads;
   if(!db){ this.setMode('local'); return; }
   this.db=db; this.setMode('cloud');
   for(const c of COLS){
    db.collection(c).onSnapshot(snap=>this.onCol(c,snap),e=>{ if(e&&e.code==='unavailable') setTimeout(()=>this.resub(c),3000); });
   }
   for(const d of ['combat','settings']) db.doc('state/'+d).onSnapshot(s=>this.onDoc(d,s),()=>{});
  }catch(e){ this.setMode('local'); }
 },
 resub(c){ if(this.db) this.db.collection(c).onSnapshot(s=>this.onCol(c,s),()=>{}); },
 setMode(m){ this.mode=m; const el=$('#sync'); if(el){ el.className='sync '+m; el.lastElementChild.textContent=m==='cloud'?'Guardado en la nube':'Guardado en este navegador'; } },
 onCol(c,snap){
  const local=this.data[c], next={}; let changed=false;
  for(const d of snap.docs){ const v=d.data(); if(!v) continue; const key=c+'/'+d.id;
   if(this.pending.has(key)&&local[d.id]){ next[d.id]=local[d.id]; continue; }
   next[d.id]=Object.assign({},v,{_cloud:true});
   if(!local[d.id]||local[d.id].updated!==v.updated) changed=true; }
  if(!snap.metadata.fromCache && !this.firstCloud[c]){
   this.firstCloud[c]=true;
   for(const [id,v] of Object.entries(local)){ if(!next[id] && !v._cloud){ next[id]=v; this.write(c,v); changed=true; } }
  } else { for(const [id,v] of Object.entries(local)) if(!next[id]&&this.pending.has(c+'/'+id)) next[id]=v; }
  if(Object.keys(local).length!==Object.keys(next).length) changed=true;
  this.data[c]=next; lsSet('oz:'+c,next);
  if(changed) this.emit(c,'remote');
 },
 onDoc(d,s){ if(!s.exists||this.pending.has('state/'+d)) return; const v=s.data(); const cur=this.docs[d];
  if(cur&&cur.updated===v.updated) return; this.docs[d]=v; lsSet('oz:doc:'+d,v); this.emit(d,'remote'); },
 list(c){ return Object.values(this.data[c]||{}); },
 get(c,id){ return (this.data[c]||{})[id]; },
 put(c,obj,ms=0){
  obj.updated=Date.now(); this.data[c][obj.id]=obj; this.emit(c,'local');
  debounce('ls:'+c,()=>lsSet('oz:'+c,this.data[c]),400);
  if(this.db){ const key=c+'/'+obj.id; this.pending.add(key);
   const go=()=>this.write(c,this.data[c][obj.id]).finally(()=>this.pending.delete(key));
   ms?debounce('w:'+key,go,ms):go(); }
 },
 async write(c,obj){ if(!this.db||!obj) return; const body=clone(obj); delete body._cloud;
  try{ await this.db.collection(c).doc(obj.id).set(body); obj._cloud=true; }
  catch(e){ if(e&&e.code==='quota_exceeded') toast('La base de datos está llena. Borra elementos que ya no uses.','bad');
   else if(e&&e.code==='invalid_argument') toast('Este elemento es demasiado grande para guardarse en la nube. Se guarda solo en este navegador.','bad'); } },
 del(c,id){ delete this.data[c][id]; lsSet('oz:'+c,this.data[c]); this.emit(c,'local');
  if(this.db) this.db.collection(c).doc(id).delete().catch(()=>{}); },
 setDoc(d,v,ms=500){ v.updated=Date.now(); this.docs[d]=v; debounce('ls:doc:'+d,()=>lsSet('oz:doc:'+d,v),300);
  if(this.db){ const key='state/'+d; this.pending.add(key);
   debounce('w:'+key,()=>{ const b=clone(this.docs[d]); this.db.doc(key).set(b).catch(()=>{}).finally(()=>this.pending.delete(key)); },ms); } },
 on(fn){ this.subs.add(fn); return ()=>this.subs.delete(fn); },
 emit(c,origin){ for(const f of this.subs) try{f(c,origin)}catch(e){console.error(e)} }
};

function roll(expr,adv=0){
 expr=String(expr).replace(/\s+/g,'').replace(/[−–]/g,'-').toLowerCase(); if(!expr) return null;
 const terms=expr.match(/[+-]?[^+-]+/g); if(!terms) return null; let total=0,parts=[],d20=null;
 for(const t of terms){ const sign=t[0]==='-'?-1:1, body=t.replace(/^[+-]/,''); const m=body.match(/^(\d*)d(\d+|%)$/);
  if(m){ const n=Math.min(100,parseInt(m[1]||'1')), s=m[2]==='%'?100:parseInt(m[2]); if(!s) return null; let rs=[];
   if(s===20&&n===1&&adv){ const a=rnd(20),b=rnd(20),p=adv>0?Math.max(a,b):Math.min(a,b); rs=[p]; parts.push(`[${a}, ${b}]→${p}`); d20=p; }
   else { for(let i=0;i<n;i++) rs.push(rnd(s)); parts.push((sign<0?'− ':'')+`[${rs.join(', ')}]`); if(s===20&&n===1) d20=rs[0]; }
   total+=sign*rs.reduce((a,b)=>a+b,0); }
  else if(/^\d+$/.test(body)){ total+=sign*parseInt(body); parts.push((sign<0?'− ':'+ ')+body); }
  else return null; }
 return {total,parts:parts.join(' '),d20,expr};
}
const rollHist=[];
function rollToast(expr,label,adv=0){
 const r=roll(expr,adv); if(!r){ toast('No entiendo esa tirada. Prueba con algo como 2d6+3.','bad'); return null; }
 const cls=r.d20===20?'crit':r.d20===1?'fumble':'';
 rollHist.unshift(`${label?label+' · ':''}${expr} = ${r.total}`); rollHist.length=Math.min(rollHist.length,40);
 toast(`<div class="rt"><b>${r.total}</b><span>${esc(label||expr)}</span></div><small class="muted mono">${esc(expr)}${adv?(adv>0?' · ventaja':' · desventaja'):''} · ${esc(r.parts)}${r.d20===20?' · ¡crítico!':r.d20===1?' · pifia':''}</small>`,cls,true);
 const h=$('#dhist'); if(h) renderHist();
 return r;
}
function toast(html,cls='',raw=false){

 $('#toasts').prepend(t); const kids=$('#toasts').children; if(kids.length>5) kids[kids.length-1].remove();

function modal({title,body,foot,wide,onClose,cls}){

 document.body.append(bg);
 const close=()=>{ if(!bg.isConnected) return; bg.remove(); document.removeEventListener('keydown',k); onClose&&onClose(); };
 const k=e=>{ if(e.key==='Escape'&&document.body.lastElementChild===bg) close(); };
 document.addEventListener('keydown',k);
 bg.addEventListener('mousedown',e=>{ if(e.target===bg) close(); });
 $('[data-x]',bg).onclick=close;
 const f=$('input,textarea,select',bg); if(f&&!('ontouchstart' in window)) setTimeout(()=>f.focus(),60);
 return {el:bg,close};
}

/* ===== Texto de reglas con tiradas clicables ===== */
function rollify(text){
 return esc(text).replace(/([+\-−]\d+) al impacto|(\d+d\d+(?:\s*[+\-−]\s*\d+)?)/g,(m,a,d)=>{
  if(a){ const n=a.replace('−','-'); return `<span class="roll" data-roll="1d20${n.startsWith('-')?n:'+'+n.replace('+','')}" data-label="Ataque" title="Tirar ataque (Mayús: ventaja, Alt: desventaja)">${a}</span> al impacto`; }
  return `<span class="roll" data-roll="${d.replace(/\s/g,'').replace('−','-')}" data-label="Daño">${d}</span>`;
 });
}
const entryHTML=s=>{ const i=s.indexOf(':'); if(i>0&&i<60) return `<p><b>${esc(s.slice(0,i))}.</b> ${rollify(s.slice(i+1).trim())}</p>`; return `<p>${rollify(s)}</p>`; };

/* ===== Ambiente animado por plano ===== */
const Ambient={
 cv:null,ctx:null,ps:[],fx:'motes',run:false,
 init(){ this.cv=$('#ambient'); if(!this.cv||reduced) return; this.ctx=this.cv.getContext('2d'); addEventListener('resize',()=>this.size()); this.size();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!this.run){this.run=true;requestAnimationFrame(t=>this.loop(t))} }); this.run=true; requestAnimationFrame(t=>this.loop(t)); },
 size(){ const d=1; this.cv.width=innerWidth*d; this.cv.height=innerHeight*d; this.cv.style.width=innerWidth+'px'; this.cv.style.height=innerHeight+'px'; this.d=d; },
 set(fx,color){ this.fx=fx; this.color=color; if(!this.ctx) return; const n=fx==='stars'?50:26; this.ps=Array.from({length:n},()=>this.spawn(true)); },
 spawn(any){ const W=this.cv.width,H=this.cv.height,f=this.fx;
  const p={x:Math.random()*W,y:any?Math.random()*H:(f==='ash'?-10:H+10),r:(Math.random()*1.8+.6)*this.d,a:Math.random(),t:Math.random()*6.28};
  if(f==='embers'){p.vx=(Math.random()-.5)*.4;p.vy=-(Math.random()*.9+.4);}
  else if(f==='ash'){p.vx=(Math.random()-.3)*.4;p.vy=Math.random()*.5+.2;}
  else if(f==='stars'){p.vx=0;p.vy=0;p.r*=.8;}
  else if(f==='spores'){p.vx=(Math.random()-.5)*.3;p.vy=(Math.random()-.5)*.3;}
  else {p.vx=(Math.random()-.5)*.15;p.vy=-(Math.random()*.25+.05);}
  return p; },
 loop(t){ if(document.hidden){this.run=false;return;} const c=this.ctx,W=this.cv.width,H=this.cv.height; c.clearRect(0,0,W,H);
  for(let i=0;i<this.ps.length;i++){ const p=this.ps[i]; p.t+=.02; p.x+=p.vx*this.d+(this.fx==='spores'?Math.sin(p.t)*.3:0); p.y+=p.vy*this.d;
   if(p.y<-20||p.y>H+20||p.x<-20||p.x>W+20){ this.ps[i]=this.spawn(false); continue; }
   const al=this.fx==='stars'?(.25+.6*Math.abs(Math.sin(p.t*.6))):this.fx==='embers'?.75:.45;
   c.globalAlpha=al*(this.fx==='ash'?.7:1); c.fillStyle=this.fx==='ash'?'#9a9aa8':this.color;
   c.beginPath(); c.arc(p.x,p.y,p.r,0,6.283); c.fill();
   if(this.fx==='embers'||this.fx==='spores'){ c.globalAlpha=al*.15; c.beginPath(); c.arc(p.x,p.y,p.r*4,0,6.283); c.fill(); } }
  c.globalAlpha=1; requestAnimationFrame(tt=>this.loop(tt)); }
};

/* ===== Buscador global ===== */
function searchIndex(){
 const it=[];
 for(const [k,r] of Object.entries(ROUTES)) it.push({g:'Secciones',t:r.t,s:r.s,a:()=>go(k)});
 for(const m of allMonsterEntries()) it.push({g:'Monstruos',t:m.name,s:`${m.en||''} · VD ${m.cr}`,tag:m,a:()=>openEntry('monster',m.id)});
 for(const x of allSpells()) it.push({g:'Hechizos',t:x.name,s:`${x.en} · ${x.level?'Nv '+x.level:'Truco'}`,tag:x,a:()=>openEntry('spell',x.id)});
 for(const x of allSpecies()) it.push({g:'Especies',t:x.name,s:x.en,tag:x,a:()=>openEntry('species',x.id)});
 for(const c of CLASSES) it.push({g:'Clases',t:c.name,s:c.en,a:()=>openEntry('cls',c.id)});
 for(const [cid,str] of Object.entries(SUBCLASS_CAT)) for(const s of str.split(';')){ const [n,src]=s.split('|'); it.push({g:'Subclases',t:n,s:`${CLASSES.find(c=>c.id===cid).name} · ${src}`,a:()=>openEntry('cls',cid)}); }
 for(const f of allFeats()) it.push({g:'Dotes',t:f.name,s:f.en,tag:f,a:()=>openEntry('feat',f.id)});
 CONDITIONS.forEach((c,i)=>it.push({g:'Reglas',t:c[0],s:'Condición',a:()=>openEntry('cond',String(i))}));
 for(const [sec,list] of RULES) for(const [n] of list) it.push({g:'Reglas',t:n,s:sec,a:()=>go('reglas')});
 for(const c of Store.list('characters')) it.push({g:'Campaña',t:c.name||'Sin nombre',s:'Personaje',a:()=>editPC(c)});
 for(const n of Store.list('npcs')) it.push({g:'Campaña',t:n.name||'Sin nombre',s:'PNJ · '+(n.role||''),a:()=>editNPC(n)});
 for(const m of Store.list('maps')) it.push({g:'Campaña',t:m.name,s:'Mapa '+LEVELS[m.level].name.toLowerCase()+' · '+planeById(m.plane||'material').name,a:()=>{ if((m.plane||'material')!==curPlane) applyPlane(m.plane||'material',true); MS.open=m.id; go('mapas'); }});
 for(const m of Store.list('manuals')) it.push({g:'Campaña',t:m.title,s:'Manual',a:()=>{ LB.open=m.id; LB.page=0; go('biblioteca'); }});
 return it;
}
function initSearch(){
 const q=$('#gq'), box=$('#gs'); let idx=null, cur=[], sel=0, res=null;
 const close=()=>{ res&&res.remove(); res=null; };
 const draw=()=>{ const s=norm(q.value.trim()); if(!idx) idx=searchIndex();
  if(!res){ res=document.createElement('div'); res.className='gres'; box.append(res); res.addEventListener('mousedown',e=>e.preventDefault()); res.addEventListener('click',e=>{ const r=e.target.closest('[data-n]'); if(r) pickR(+r.dataset.n); }); }
  if(!s){ const rec=lsGet('oz:recent',[]).map(r=>{ const x=findEntry(r.k,r.id); return x&&{g:'Recientes',t:x.name,s:KINDS[r.k],a:()=>openEntry(r.k,r.id)}; }).filter(Boolean);
   cur=rec.length?rec:idx.filter(i=>i.g==='Secciones'); }
  else { const sc=i=>{ const n=norm(i.t); return n.startsWith(s)?0:n.includes(s)?1:norm(i.s||'').includes(s)?2:9; };
   cur=idx.map(i=>[sc(i),i]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||a[1].t.length-b[1].t.length).slice(0,60).map(a=>a[1]);
   const order=['Secciones','Monstruos','Hechizos','Especies','Clases','Subclases','Dotes','Reglas','Campaña']; cur.sort((a,b)=>order.indexOf(a.g)-order.indexOf(b.g)); }
  const dx=q.value.trim(); if(/^\d*d\d/i.test(dx)&&roll(dx)) cur.unshift({g:'Dados',t:'Tirar '+dx,s:'Enter para tirar',a:()=>rollToast(dx,'Tirada')});
  if(s.length>1) cur.push({g:'Manuales',t:`Buscar «${q.value.trim()}» en mis manuales`,s:'Texto completo de tus PDF',a:()=>{ LB.q=q.value.trim(); LB.open=null; go('biblioteca'); }});
  sel=clamp(sel,0,cur.length-1); let last='';
  res.innerHTML=cur.map((i,n)=>{ const h=i.g!==last?`<div class="grp">${i.g}</div>`:''; last=i.g; return h+`<div class="r ${n===sel?'sel':''}" data-n="${n}"><span class="t">${esc(i.t)}</span>${i.s?`<small>${esc(i.s.slice(0,46))}</small>`:''}${i.tag&&i.tag.full===false?`<span class="tag ix">${esc(i.tag.source)}</span>`:''}</div>`; }).join('')||'<div class="muted" style="padding:12px">Sin resultados.</div>';
  const se=$('.r.sel',res); se&&se.scrollIntoView({block:'nearest'}); };
 const pickR=n=>{ const i=cur[n]; if(!i) return; q.value=''; q.blur(); close(); i.a(); };
 q.addEventListener('focus',()=>{ idx=searchIndex(); sel=0; draw(); });
 q.addEventListener('input',()=>{ sel=0; draw(); });
 q.addEventListener('blur',()=>setTimeout(close,120));
 q.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){ sel++; draw(); e.preventDefault(); } else if(e.key==='ArrowUp'){ sel=Math.max(0,sel-1); draw(); e.preventDefault(); } else if(e.key==='Enter'){ pickR(sel); } else if(e.key==='Escape'){ q.value=''; q.blur(); } });
}

const WS={};
function wikiList(v,cfg){
 const st=WS[cfg.key]=WS[cfg.key]||{q:'',f:{}};
 const all=cfg.items(); const nFull=all.filter(x=>x.full!==false).length;
 v.innerHTML=`<div class="wrap"><div class="wl-head" style="--i:0"><div class="grow"><span class="eyebrow">${cfg.eyebrow}</span><h2 class="h1">${cfg.title}</h2><p class="muted" style="margin:6px 0 0">${nFull} con ficha completa · ${all.length-nFull} en el índice de manuales y expansiones</p></div>${cfg.create?`<button class="btn pri" id="wcreate">${I.plus} ${cfg.create.label}</button>`:''}</div>
  <div class="panel" style="--i:1;padding:14px"><div class="row"><div class="search">${I.search}<input class="inp" id="wq" placeholder="Filtrar ${cfg.title.toLowerCase()}…" value="${esc(st.q)}" aria-label="Filtrar"></div>
  <div class="filters">${cfg.filters.map(f=>`<select class="sel" data-f="${f.id}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}</option>${f.opts().map(o=>{const [val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(st.f[f.id]??'')===String(val)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`).join('')}
  <span class="chip ${st.f.full?'on':''}" id="wfull">Solo ficha completa</span><span class="chip" id="wclear">Limpiar</span></div></div></div>
  <div class="wl" id="wl" style="--i:2"></div></div>`;
 const draw=()=>{ const q=norm(st.q.trim());
  let l=all.filter(x=>(!q||norm(`${x.name} ${x.en||''} ${cfg.text?cfg.text(x):''}`).includes(q))&&(!st.f.full||x.full!==false)&&cfg.filters.every(f=>st.f[f.id]==null||st.f[f.id]===''||f.test(x,st.f[f.id])));
  l.sort(cfg.sort);
  let h='', last=null;
  for(const x of l){ const g=cfg.group(x); if(g!==last){ h+=`<div class="gh">${esc(g)}</div>`; last=g; } const r=cfg.row(x);
   h+=`<div class="wr ${x.full===false?'ix':''}" data-entry="${cfg.kind}:${esc(x.id)}"><span class="bd">${r.bd}</span><div style="min-width:0"><div class="nm">${esc(x.name)}</div><div class="ds">${esc(r.ds)}</div></div><div class="meta">${srcTag(x)}</div></div>`; }
  $('#wl').innerHTML=h||'<div class="empty"><div class="h3">Nada coincide</div>Prueba con otro nombre o limpia los filtros.</div>'; };
 $('#wq').oninput=e=>{ st.q=e.target.value; draw(); };
 $$('[data-f]',v).forEach(s=>s.onchange=()=>{ st.f[s.dataset.f]=s.value; draw(); });
 $('#wfull').onclick=e=>{ st.f.full=!st.f.full; e.target.classList.toggle('on',st.f.full); draw(); };
 $('#wclear').onclick=()=>{ WS[cfg.key]={q:'',f:{}}; render(true); };
 if(cfg.create) $('#wcreate').onclick=cfg.create.fn;
 draw();
}

const BS={q:'',type:'',src:'todos',crMin:'',crMax:'',sort:'nombre',sel:null};
function allMonsters(){
 const over=Store.data.monsters||{}, out=[];
 for(const m of SRD_MONSTERS) out.push(over[m.id]?Object.assign({},over[m.id],{_mod:true}):m);
 for(const m of Object.values(over)) if(!String(m.id).startsWith('srd-')) out.push(m);
 return out;
}
const monType=m=>(m.type||'').split('(')[0].trim();
function filteredMonsters(){
 const q=norm(BS.q.trim());
 let l=allMonsters().filter(m=>{
  if(q&&!norm(`${m.name} ${m.en||''} ${m.type} ${(m.tags||[]).join(' ')}`).includes(q)) return false;
  if(BS.type&&monType(m)!==BS.type) return false;
  if(BS.src==='srd'&&m.source!=='SRD') return false;
  if(BS.src==='homebrew'&&m.source==='SRD') return false;
  if(BS.src==='mod'&&!m._mod) return false;
  if(BS.crMin!==''&&crNum(m.cr)<crNum(BS.crMin)) return false;
  if(BS.crMax!==''&&crNum(m.cr)>crNum(BS.crMax)) return false;
  return true; });
 l.sort(BS.sort==='vd'?(a,b)=>crNum(a.cr)-crNum(b.cr)||a.name.localeCompare(b.name):(a,b)=>a.name.localeCompare(b.name));
 return l;
}

  <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><h2>${esc(m.name)}</h2><div class="ty">${esc(m.size)} ${esc((m.type||'').toLowerCase())}, ${esc((m.align||'').toLowerCase())}${m.en?` · <span class="muted">${esc(m.en)}</span>`:''}</div></div>
  <div class="row" style="gap:6px;flex-wrap:nowrap">${m.source==='SRD'?(m._mod?'<span class="tag mod">Modificado</span>':'<span class="tag">SRD</span>'):'<span class="tag hb">Homebrew</span>'}</div></div>
  <div class="kv"><span><b>CA</b> ${esc(m.ac)}${m.acNote?` (${esc(m.acNote)})`:''}</span><span><b>PG</b> ${esc(m.hp)}${m.hpDice?` (<span class="roll" data-roll="${esc(m.hpDice)}" data-label="PG ${esc(m.name)}">${esc(m.hpDice)}</span>)`:''}</span><span><b>Velocidad</b> ${esc(m.speed)}</span></div>

function editMonster(m){

const CS=()=>{ if(!Store.docs.combat) Store.docs.combat={round:1,turn:0,active:false,list:[],log:[],hpMode:'avg'}; return Store.docs.combat; };
const saveCombat=()=>{ Store.setDoc('combat',CS(),400); counts(); };
const clog=t=>{ const c=CS(); c.log.unshift(`R${c.round} · ${t}`); c.log.length=Math.min(c.log.length,60); };
function addMonstersToCombat(m,q){
 const c=CS(); const same=c.list.filter(x=>x.ref===m.id).length;
 for(let i=0;i<q;i++){ const hp=c.hpMode==='roll'&&m.hpDice?(roll(m.hpDice)?.total||m.hp):m.hp;
  c.list.push({id:uid(),name:q>1||same?`${m.name} ${same+i+1}`:m.name,kind:'mon',ref:m.id,init:null,dex:mod(m.dex),ac:Number(m.ac)||10,hp,max:hp,tmp:0,conds:[],conc:false,cr:m.cr}); }
 clog(`Entra ${q} × ${m.name}`); saveCombat();
}
function addPCsToCombat(){ const c=CS(); let n=0; for(const p of Store.list('characters')){ if(c.list.find(x=>x.ref===p.id)) continue;
  c.list.push({id:uid(),name:p.name||'PJ',kind:'pj',ref:p.id,init:null,dex:mod(p.dex),ac:Number(p.ac)||10,hp:p.hp??p.max??10,max:p.max||10,tmp:0,conds:[],conc:false,ds:{s:0,f:0},level:p.level||1}); n++; }
 if(n){ clog(`Se unen ${n} personajes`); saveCombat(); } return n; }
function addNPCToCombat(n){ const t=n.template&&allMonsters().find(m=>m.id===n.template); const c=CS();
 c.list.push({id:uid(),name:n.name,kind:'pnj',ref:n.id,tpl:t?.id||null,init:null,dex:t?mod(t.dex):0,ac:t?Number(t.ac):10,hp:t?t.hp:10,max:t?t.hp:10,tmp:0,conds:[],conc:false,cr:t?.cr,ally:n.att==='aliado'});
 clog(`Entra ${n.name}`); saveCombat(); }
function sortInit(c){ c.list.sort((a,b)=>(b.init??-99)-(a.init??-99)||(b.dex||0)-(a.dex||0)); }
function vCombate(v){
 viewDeps=['combat','characters'];

 </div>`;

function hpChange(id,a){
 const c=CS(), x=c.list.find(k=>k.id===id); const row=$(`[data-cid="${id}"]`); const n=Number($('[name=amt]',row).value)||0; if(!n) return;
 if(a==='dmg'){ let d=n; if(x.tmp){ const t=Math.min(x.tmp,d); x.tmp-=t; d-=t; } x.hp=Math.max(0,x.hp-d); clog(`${x.name} recibe ${n} de daño (${x.hp}/${x.max})`);
  if(x.conc) toast(`${x.name}: salvación de Constitución CD ${Math.min(30,Math.max(10,Math.floor(n/2)))} para mantener la concentración.`,'');
  if(x.hp===0){ clog(`${x.name} cae a 0 PG`); if(x.kind!=='pj') toast(`${x.name} ha caído.`); } }
 else if(a==='heal'){ x.hp=Math.min(x.max,x.hp+n); if(x.ds) x.ds={s:0,f:0}; clog(`${x.name} recupera ${n} PG (${x.hp}/${x.max})`); }
 else { x.tmp=Math.max(x.tmp||0,n); clog(`${x.name} gana ${n} PG temporales`); }
 if(x.kind==='pj'){ const p=Store.get('characters',x.ref); if(p){ p.hp=x.hp; Store.put('characters',p,1000); } }
 saveCombat(); render(true); const r2=$(`[data-cid="${id}"]`); if(r2) r2.classList.add(a==='dmg'?'flash-dmg':'flash-heal');
}
function nextTurn(){
 const c=CS(); if(!c.list.length){ toast('Añade combatientes primero.'); return; }
 if(!c.active){ if(c.list.some(x=>x.init==null)){ for(const x of c.list) if(x.init==null) x.init=(roll('1d20')?.total||10)+(x.dex||0); } sortInit(c); c.active=true; c.turn=0; c.round=1; clog('¡Comienza el combate!'); }
 else { const x=c.list[c.turn]; if(x){ x.conds=(x.conds||[]).filter(k=>{ if(k.r){ k.r--; if(k.r<=0){ clog(`${x.name} ya no está ${k.n.toLowerCase()}`); return false; } } return true; }); }
  c.turn++; if(c.turn>=c.list.length){ c.turn=0; c.round++; clog(`Ronda ${c.round}`); } }
 saveCombat(); render(true);
 const cur=$('.cmb.cur'); if(cur) cur.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'});
}

const loadScript=src=>new Promise((res,rej)=>{ if($(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('No se pudo cargar '+src.split('/').pop())); document.head.append(s); });
let pdfReady=null;
const abs=p=>new URL(p,location.href).href;
function loadPdfJs(){
 if(window.pdfjsLib) return Promise.resolve(); if(pdfReady) return pdfReady;
 const viaCdn=async()=>{ await loadScript(PDFJS+'pdf.min.js'); await loadScript(PDFJS+'pdf.worker.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; };
 pdfReady=(async()=>{
  if(!window.claude&&location.protocol.startsWith('http')){ try{ const m=await import(abs('vendor/pdfjs/pdf.min.mjs')); m.GlobalWorkerOptions.workerSrc=abs('vendor/pdfjs/pdf.worker.min.mjs'); window.pdfjsLib=m; return; }catch(e){ console.warn(e); } }
  await viaCdn();
 })().catch(e=>{ pdfReady=null; throw e; });
 return pdfReady;
}
const pdfDocs=new Map();
const closeDoc=d=>{ try{ if(d.loadingTask) d.loadingTask.destroy(); else if(d.destroy) d.destroy(); }catch(e){} };
async function openPdf(id){
 if(pdfDocs.has(id)) return pdfDocs.get(id);
 const blob=await IDB.get(id,'pdfs'); if(!blob) return null;
 await loadPdfJs(); const doc=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise;
 pdfDocs.set(id,doc); if(pdfDocs.size>3){ const k=pdfDocs.keys().next().value; closeDoc(pdfDocs.get(k)); pdfDocs.delete(k); }
 return doc;
}

  const flush=()=>{ if(cur&&cur.text.trim()){ cur.text=cur.text.replace(/\s+/g,' ').trim(); lines.push(cur); const k=Math.round(cur.size); sizes[k]=(sizes[k]||0)+cur.text.length; } cur=null; };

function parseText(txt,md){

/* OCR automático en segundo plano */
const OCR={

  try{ for(;;){ const m=Store.list('manuals').find(x=>x.ocr&&x.ocr.done<x.ocr.total&&x.hasPdf&&!x.ocrFail); if(!m) break; this.cur=m.id; await this.run(m); } }
  catch(e){ console.error(e); } finally{ this.running=false; this.cur=null; if(this.worker){ try{ await this.worker.terminate(); }catch(e){} this.worker=null; } }
 },
 async run(m){
  const content=await manualContent(m), doc=await openPdf(m.id); if(!content||!doc){ m.ocrFail=true; Store.put('manuals',m); return; }
  if(!this.worker){ try{ const local=!window.claude&&location.protocol.startsWith('http'); if(local){ await loadScript(abs('vendor/ocr/tesseract.min.js')); this.worker=await Tesseract.createWorker('spa',1,{workerPath:abs('vendor/ocr/worker.min.js'),corePath:abs('vendor/ocr'),langPath:abs('vendor/ocr'),gzip:true}); } else { await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'); this.worker=await Tesseract.createWorker('spa+eng'); } }
   catch(e){ m.ocrFail=true; Store.put('manuals',m); toast('No pude iniciar el reconocimiento de texto (OCR). Funciona en la versión publicada en Cloudflare con conexión a internet.','bad'); return; } }
  const todo=content.ocrTodo||[];
  while(m.ocr.done<todo.length){ const i=todo[m.ocr.done];
   const pg=await doc.getPage(i+1); const v0=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:Math.min(2.5,1700/v0.width)});
   const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height; await pg.render({canvas:cv,canvasContext:cv.getContext('2d'),viewport:vp}).promise; pg.cleanup();
   const {data}=await this.worker.recognize(cv); cv.width=0;
   content.pages[i]=(data.text||'').split(/\n\s*\n/).map(p=>p.replace(/-\n/g,'').replace(/\s*\n\s*/g,' ').trim()).filter(p=>p.length>1).map(p=>['p',p]);
   normCache.delete(m.id+':'+i); m.ocr.done++;
   if(m.ocr.done%4===0||m.ocr.done===todo.length){ await IDB.set(m.id,content); if(!m.lang&&m.ocr.done>=3){ m.lang=detectLang(content.pages.map(p=>p.map(b=>b[1]).join(' ')).join(' ')); } m.chars=content.pages.reduce((s,p)=>s+p.reduce((a,b)=>a+b[1].length,0),0); Store.put('manuals',m); ocrUI(m); }
   if(!Store.get('manuals',m.id)) return; }
  toast(`${m.title}: reconocimiento de texto terminado.`);

};

 supported:()=>'Translator' in self,

 box.innerHTML=content.pages.map((p,i)=>`<article class="page" id="pg-${i}" data-i="${i}"><div class="pn">Página ${i+1}</div><div class="pb">${trans?'<p class="muted">Traduciendo…</p>':p.map(bl=>bl[0]==='h'?`<h3>${hl(bl[1],qn())}</h3>`:`<p>${hl(bl[1],qn())}</p>`).join('')||'<p class="muted">(Página sin texto)</p>'}</div></article>`).join('');
 goPage=p=>{ LB.page=p; $('#rp').value=p+1; const t=$('#pg-'+p); if(t){ const mk=$('mark',t); scrollToEl(mk||t,!!mk); } };
 if(trans) observePages(m,content,async(el,i)=>{ await fillTrans(m,content,i,$('.pb',el)); });
 else observePages(m,content,()=>{});
 requestAnimationFrame(()=>goPage(LB.page));
}
async function fillTrans(m,content,i,box){
 if(box.dataset.done) return; box.dataset.done='1';
 try{ const out=await TR.page(m.id,i,content.pages[i],false); box.innerHTML=out.map(b=>b[0]==='h'?`<h3>${esc(b[1])}</h3>`:`<p>${esc(b[1])}</p>`).join('')||'<p class="muted">(Página sin texto)</p>'; }
 catch(e){ delete box.dataset.done;
  if(e.message==='activate'){ box.innerHTML=`<p class="muted">La traducción necesita descargar el traductor del navegador una sola vez.</p><button class="btn pri sm" data-act>${I.sparkle} Activar traducción</button>`;
   $('[data-act]',box).onclick=async()=>{ try{ $('#trstat').textContent='Preparando el traductor…'; await TR.get('en','es',true); $('#trstat').textContent=''; render(true); }catch(err){ $('#trstat').textContent='No se pudo activar el traductor.'; } }; }
  else box.innerHTML=`<p class="muted">Tu navegador no tiene traductor integrado. Usa Chrome o Edge en computadora (versión 138 o posterior) para la traducción automática.</p>`; }
}
function observePages(m,content,onShow){
 if(readerObs) readerObs.disconnect();
 readerObs=new IntersectionObserver(es=>{ for(const e of es){ const i=+e.target.dataset.i; if(e.isIntersecting){ onShow(e.target,i,true); if(e.intersectionRatio>0&&Math.abs(e.boundingClientRect.top)<innerHeight/2){ LB.page=i; const rp=$('#rp'); if(rp) rp.value=i+1; } } else onShow(e.target,i,false); } },{rootMargin:'1200px 0px'});
 $$('#rpages [data-i]').forEach(el=>readerObs.observe(el));
}
let pdfZoom=1;
async function pdfMode(m,content){
 const box=$('#rpages'); box.innerHTML='<div class="muted">Abriendo el PDF…</div>';
 let doc; try{ doc=await openPdf(m.id); }catch(e){ box.innerHTML=`<div class="empty">No pude abrir el PDF: ${esc(e.message||e)}</div>`; return; }
 if(!doc||route!=='biblioteca'||LB.open!==m.id) return;
 const p1=await doc.getPage(1); const v1=p1.getViewport({scale:1}); const ratio=v1.height/v1.width;
 const dual=LB.mode==='dual'; box.classList.toggle('isdual',dual);
 const width=()=>Math.min(dual?620:900,(box.clientWidth||800)*(dual?.55:1))*pdfZoom;
 box.innerHTML=Array.from({length:doc.numPages},(_,i)=>`<div class="pdfrow ${dual?'dual':''}" id="pg-${i}" data-i="${i}"><div class="pdfp" style="width:${width()}px;aspect-ratio:${1/ratio}"><canvas width="0" height="0"></canvas><span class="pn2">${i+1}</span></div>${dual?'<div class="pg-tr pb"><p class="muted">Traduciendo…</p></div>':''}</div>`).join('');
 const rendering=new Map();
 const show=async(el,i,on)=>{ const pp=$('.pdfp',el), cv=$('canvas',pp);
  if(!on){ if(cv.dataset.r&&!rendering.has(i)){ cv.width=0; cv.height=0; delete cv.dataset.r; } return; }
  if(dual) fillTrans(m,content,i,$('.pg-tr',el));
  if(cv.dataset.r||rendering.has(i)) return; rendering.set(i,1);
  try{ const pg=await doc.getPage(i+1); const v0=pg.getViewport({scale:1}); const w=pp.clientWidth||width(); const dpr=Math.min(devicePixelRatio||1,2); const vp=pg.getViewport({scale:w*dpr/v0.width});
   pp.style.aspectRatio=v0.width/v0.height; cv.width=vp.width; cv.height=vp.height; await pg.render({canvas:cv,canvasContext:cv.getContext('2d'),viewport:vp}).promise; cv.dataset.r='1'; pg.cleanup(); }
  catch(e){ console.error('render',e); } finally{ rendering.delete(i); } };
 observePages(m,content,show);
 goPage=p=>{ LB.page=p; $('#rp').value=p+1; const t=$('#pg-'+p); if(t) scrollToEl(t); };
 const rezoom=f=>{ pdfZoom=clamp(pdfZoom*f,.5,3); const cur=LB.page; $$('.pdfp',box).forEach(pp=>{ pp.style.width=width()+'px'; const cv=$('canvas',pp); cv.width=0; cv.height=0; delete cv.dataset.r; }); observePages(m,content,show); goPage(cur); };
 $('#zi')&&($('#zi').onclick=()=>rezoom(1.2)); $('#zo')&&($('#zo').onclick=()=>rezoom(1/1.2));
 requestAnimationFrame(()=>goPage(LB.page));
}

const vnoise=(x,y,s)=>{ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf); const a=hashXY(xi,yi,s)/4294967295,b=hashXY(xi+1,yi,s)/4294967295,c=hashXY(xi,yi+1,s)/4294967295,d=hashXY(xi+1,yi+1,s)/4294967295; return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; };
const fbm=(x,y,s)=>{ let t=0,a=1,f=1,n=0; for(let o=0;o<5;o++){ t+=vnoise(x*f,y*f,s+o*31)*a; n+=a; a*=.5; f*=2; } return clamp((t/n-.5)*2.3+.5,0,1); };
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; const t=f<0?0:255, p=Math.abs(f); r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p); return `rgb(${r},${g},${b})`; }

function generateTerrain(m,seed){
 const w=m.w,h=m.h,lv=m.level; const out=new Array(w*h); const E=new Float32Array(w*h);
 for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x; const nx=x/w-.5, ny=y/h-.5;
  if(lv==='global'){ const d=Math.sqrt(nx*nx*1.1+ny*ny*1.4)*2; const e=fbm(x/13,y/13,seed)*.85+.2-d*.42; const mo=fbm(x/9+40,y/9,seed+99); const lat=Math.abs(ny)*2; E[i]=e;
   out[i]=e<.33?'o':e<.41?'a':e<.44?'c':e>.85?'n':e>.77?(hashXY(x,y,seed)%9===0?'v':'m'):e>.7?'h':lat>.84?'t':mo<.36?'d':mo<.47?'p':mo<.6?'f':mo<.68?(lat<.45?'j':'f'):'s'; }
  else if(lv==='nacional'){ const e=fbm(x/12,y/12,seed); const mo=fbm(x/8+70,y/8,seed+51); const cr=fbm(x/5,y/5,seed+7); E[i]=e;
   out[i]=e<.24?'w':e>.9?'n':e>.82?'m':e>.72?'h':mo<.3?'x':mo<.5?(cr>.62?'k':'g'):mo<.62?'f':mo<.71?'F':'s'; }
  else { const e=fbm(x/7,y/7,seed); E[i]=e; out[i]=e<.3?'a':e<.36?'A':e>.68?'e':(hashXY(x,y,seed)%17===0?'t':hashXY(x,y,seed+3)%23===0?'b':'g'); } }
 if(lv==='nacional'){ for(let k=0;k<2;k++){ let best=-1,bi=0; for(let t=0;t<40;t++){ const i=hashXY(t,k,seed)%(w*h); if(E[i]>best&&out[i]!=='w'){best=E[i];bi=i;} }
   let cur=bi; for(let s=0;s<w*h&&cur>=0;s++){ if(out[cur]==='w') break; out[cur]='r'; const cx=cur%w, cy=(cur/w)|0; let nb=-1, ne=E[cur]+.02;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const xx=cx+dx, yy=cy+dy; if(xx<0||yy<0||xx>=w||yy>=h){ nb=-2; break; } const j=yy*w+xx; if(out[j]!=='r'&&E[j]<ne){ ne=E[j]; nb=j; } }
    if(nb===-2) break; if(nb<0){ E[cur]+=.05; const cands=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[cx+dx,cy+dy]).filter(([a,b])=>a>=0&&b>=0&&a<w&&b<h&&out[b*w+a]!=='r'); if(!cands.length) break; const [a,b]=cands[hashXY(cx,cy,s)%cands.length]; nb=b*w+a; } cur=nb; } } }
 if(lv==='minimo'){ let ry=Math.floor(h/2); for(let x=0;x<w;x++){ if(hashXY(x,1,seed)%5===0) ry=clamp(ry+(hashXY(x,2,seed)%3)-1,2,h-3); out[ry*w+x]='c'; out[(ry+1)*w+x]='c'; } }
 return out.join('');
}

function drawCell(tc,m,x,y){
 const ch=m.t[y*m.w+x], d=TL[m.level][ch]||TL[m.level][LEVELS[m.level].base], px=x*C, py=y*C, h=hashXY(x,y);

}
function glyph(c,g,px,py,h,col){
 const r=k=>((h>>>(k*3))%7)/7;
 c.save(); c.lineWidth=1.4; c.lineCap='round';
 if(g==='trees'||g==='trees2'){ const n=g==='trees'?3:5; for(let i=0;i<n;i++){ const x=px+5+r(i)*20+((i%2)*4), y=py+6+r(i+5)*18; c.fillStyle=shade(col,-.32); c.beginPath(); c.arc(x+1.5,y+2.5,5.5,0,7); c.fill(); c.fillStyle=shade(col,.12); c.beginPath(); c.arc(x,y,5,0,7); c.fill(); } }
 else if(g==='tree'){ c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.arc(px+18,py+19,12,0,7); c.fill(); c.fillStyle=shade(col,.08); c.beginPath(); c.arc(px+16,py+16,12,0,7); c.fill(); c.fillStyle=shade(col,.3); c.beginPath(); c.arc(px+12,py+12,5,0,7); c.fill(); }
 else if(g==='bush'){ c.fillStyle=shade(col,.2); for(let i=0;i<3;i++){ c.beginPath(); c.arc(px+8+i*8,py+12+r(i)*10,5,0,7); c.fill(); } }
 else if(g==='mount'){ const bx=px+4+r(1)*4, s=22+r(2)*4; c.fillStyle=shade(col,-.25); c.beginPath(); c.moveTo(bx,py+28); c.lineTo(bx+s/2,py+28-s); c.lineTo(bx+s,py+28); c.fill(); c.fillStyle=shade(col,.18); c.beginPath(); c.moveTo(bx,py+28); c.lineTo(bx+s/2,py+28-s); c.lineTo(bx+s/2-2,py+28); c.fill(); c.fillStyle='rgba(255,255,255,.75)'; c.beginPath(); c.moveTo(bx+s/2-4,py+28-s+7); c.lineTo(bx+s/2,py+28-s); c.lineTo(bx+s/2+4,py+28-s+7); c.fill(); }
 else if(g==='hill'){ c.strokeStyle=shade(col,-.3); c.beginPath(); c.arc(px+11,py+22,7,Math.PI,0); c.stroke(); c.beginPath(); c.arc(px+22,py+17,6,Math.PI,0); c.stroke(); }
 else if(g==='swamp'){ c.strokeStyle=shade(col,-.3); for(let i=0;i<3;i++){ const y=py+8+i*8+r(i)*3, x=px+4+r(i+2)*10; c.beginPath(); c.moveTo(x,y); c.lineTo(x+12,y); c.stroke(); c.beginPath(); c.moveTo(x+6,y); c.lineTo(x+4,y-5); c.moveTo(x+6,y); c.lineTo(x+8,y-5); c.stroke(); } }
 else if(g==='dots'){ c.fillStyle=shade(col,-.22); for(let i=0;i<4;i++){ c.beginPath(); c.arc(px+4+r(i)*24,py+4+r(i+4)*24,1.3,0,7); c.fill(); } }
 else if(g==='wave'){ c.strokeStyle=shade(col,.18); c.globalAlpha=.7; const y=py+10+r(1)*12, x=px+5+r(2)*10; c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+4,y-4,x+8,y); c.quadraticCurveTo(x+12,y+4,x+16,y); c.stroke(); }
 else if(g==='crop'){ c.strokeStyle=shade(col,-.18); for(let i=0;i<4;i++){ c.beginPath(); c.moveTo(px+2+i*8,py+30); c.lineTo(px+8+i*8,py+2); c.stroke(); } }
 else if(g==='brick'){ c.strokeStyle=shade(col,-.25); c.lineWidth=1; c.beginPath(); c.moveTo(px,py+16); c.lineTo(px+C,py+16); c.moveTo(px+16,py); c.lineTo(px+16,py+16); c.moveTo(px+8,py+16); c.lineTo(px+8,py+32); c.moveTo(px+24,py+16); c.lineTo(px+24,py+32); c.stroke(); }
 else if(g==='tile'){ c.strokeStyle=shade(col,-.2); c.lineWidth=1; c.strokeRect(px+1.5,py+1.5,C-3,C-3); }
 else if(g==='plank'){ c.strokeStyle=shade(col,-.28); c.lineWidth=1; for(let i=1;i<4;i++){ c.beginPath(); c.moveTo(px,py+i*8); c.lineTo(px+C,py+i*8); c.stroke(); } c.beginPath(); c.moveTo(px+6+r(1)*20,py); c.lineTo(px+6+r(1)*20,py+8); c.stroke(); }
 else if(g==='wall'){ c.fillStyle=shade(col,.15); c.fillRect(px,py,C,4); c.strokeStyle='rgba(0,0,0,.4)'; c.strokeRect(px+.5,py+.5,C-1,C-1); }
 else if(g==='door'){ c.fillStyle=shade(col,-.35); c.fillRect(px+6,py+3,20,26); c.fillStyle='#f3d27a'; c.beginPath(); c.arc(px+21,py+17,1.8,0,7); c.fill(); }
 else if(g==='rubble'){ c.fillStyle=shade(col,-.3); for(let i=0;i<5;i++){ c.fillRect(px+3+r(i)*24,py+3+r(i+3)*24,3+r(i+6)*4,3); } }
 else if(g==='lava'){ c.strokeStyle='#ffd25a'; c.globalAlpha=.8; c.beginPath(); c.moveTo(px+2,py+6+r(1)*20); c.lineTo(px+14,py+10+r(2)*14); c.lineTo(px+30,py+4+r(3)*24); c.stroke(); }
 c.restore();
}
function rebuildTerrain(){ const m=Ed.map; Ed.terrC=Ed.terrC||document.createElement('canvas'); Ed.terrC.width=m.w*C; Ed.terrC.height=m.h*C; const tc=Ed.terrC.getContext('2d'); for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++) drawCell(tc,m,x,y); }
function rebuildRegions(){
 const m=Ed.map; Ed.regC=Ed.regC||document.createElement('canvas'); Ed.regC.width=m.w*C; Ed.regC.height=m.h*C; const rc=Ed.regC.getContext('2d'); rc.clearRect(0,0,Ed.regC.width,Ed.regC.height);
 const acc={}; const R=(x,y)=>(x<0||y<0||x>=m.w||y>=m.h)?'.':m.r[y*m.w+x];
 for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){ const k=R(x,y); if(k==='.') continue; const reg=m.regions[k.charCodeAt(0)-65]; if(!reg) continue;
  rc.globalAlpha=.24; rc.fillStyle=reg.color; rc.fillRect(x*C,y*C,C,C); rc.globalAlpha=.95;
  if(R(x-1,y)!==k) rc.fillRect(x*C,y*C,3,C); if(R(x+1,y)!==k) rc.fillRect(x*C+C-3,y*C,3,C); if(R(x,y-1)!==k) rc.fillRect(x*C,y*C,C,3); if(R(x,y+1)!==k) rc.fillRect(x*C,y*C+C-3,C,3);
  const a=acc[k]=acc[k]||{x:0,y:0,n:0}; a.x+=x; a.y+=y; a.n++; }

}
function iconPath(c,kind,x,y,s){
 c.beginPath(); const p=(a,b)=>c.lineTo(x+a*s,y+b*s), mv=(a,b)=>c.moveTo(x+a*s,y+b*s);
 switch(kind){
  case 'capital': for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?.38:.85; i?p(Math.cos(a)*rr,Math.sin(a)*rr):mv(Math.cos(a)*rr,Math.sin(a)*rr);} c.closePath(); c.fill(); break;
  case 'ciudad': mv(-.7,.6);p(-.7,-.2);p(-.4,-.2);p(-.4,-.6);p(-.1,-.6);p(-.1,-.2);p(.1,-.2);p(.1,-.75);p(.45,-.75);p(.45,-.1);p(.7,-.1);p(.7,.6); c.closePath(); c.fill(); break;
  case 'pueblo': mv(-.6,.6);p(-.6,-.05);p(0,-.6);p(.6,-.05);p(.6,.6); c.closePath(); c.fill(); break;
  case 'castillo': mv(-.7,.65);p(-.7,-.55);p(-.45,-.55);p(-.45,-.3);p(-.15,-.3);p(-.15,-.55);p(.15,-.55);p(.15,-.3);p(.45,-.3);p(.45,-.55);p(.7,-.55);p(.7,.65); c.closePath(); c.fill(); break;

/* Utilidades de texto */
const W_SIZE='(Tiny|Small|Medium|Large|Huge|Gargantuan|Diminut[oa]|Pequeñ[oa]|Median[oa]|Grande|Enorme|Gargantuesc[oa])';
const TYPE_ES_MAP={aberration:'Aberración',beast:'Bestia',celestial:'Celestial',construct:'Constructo',dragon:'Dragón',elemental:'Elemental',fey:'Feérico',fiend:'Infernal',giant:'Gigante',humanoid:'Humanoide',monstrosity:'Monstruosidad',ooze:'Cieno',plant:'Planta',undead:'No muerto',swarm:'Enjambre'};
const typeEs=t=>t.replace(/^\p{L}+/u,w=>TYPE_ES_MAP[w.toLowerCase()]||w);

const TYPE_RE=new RegExp('(?:^|[\\s.])'+W_SIZE+'(?:\\s+(?:or|o)\\s+\\p{L}+)?\\s+([\\p{L}][\\p{L} ()\\-/]{1,60}?)\\s*,\\s*((?:lawful|chaotic|neutral|unaligned|any|typically|legal|ca[oó]tic[oa]|neutral|sin alineamiento|cualquier|normalmente|generalmente)[\\p{L} \\-]{0,40}?)(?=\\s*(?:\\n|Armor|AC\\b|Clase de|CA\\b|$))','iu');

function matchType(s){ let m=s.match(TYPE_RE); if(m) return {index:m.index,len:m[0].length,size:m[1],type:m[2].trim(),align:m[3].trim()};
 m=s.match(TYPE_ES); if(m) return {index:m.index,len:m[0].length,size:m[3],type:m[1]+((m[2]||m[4])?` (${m[2]||m[4]})`:''),align:m[5].trim()}; return null; }
const HP_RE=/(?:Hit Points|Puntos de [Gg]olpe|(?<![\p{L}])HP|(?<![\p{L}])PG)\s+\d+\s*(?:\(|$|\s)/u;
const LABELS=[['ac','Armor Class|Clase de [Aa]rmadura|AC|CA'],['hp','Hit Points|Puntos de [Gg]olpe|HP|PG'],['speed','Speed|Velocidad'],['init','Initiative|Iniciativa'],
 ['saves','Saving Throws|Tiradas de salvación|Salvaciones'],['skills','Skills|Habilidades'],['vuln','Damage Vulnerabilities|Vulnerabilidades al daño|Vulnerabilities|Vulnerabilidades'],
 ['res','Damage Resistances|Resistencias al daño|Resistances|Resistencias'],['imm','Damage Immunities|Inmunidades al daño'],['condImm','Condition Immunities|Inmunidades a estados|Inmunidades a condiciones'],
 ['imm2','Immunities|Inmunidades'],['senses','Senses|Sentidos'],['lang','Languages|Idiomas'],['gear','Gear|Equipo'],['cr','Challenge|Desafío|CR|VD'],['pb','Proficiency Bonus|Bonificador por competencia|Bonificador de competencia']];
const LABEL_RE=new RegExp('(?<![\\p{L}])('+LABELS.map(l=>l[1]).join('|')+')(?![\\p{L}])','gu');

const SECTIONS=[['bonus','Bonus Actions|Acciones adicionales|Acciones bonus'],['legendary','Legendary Actions|Acciones legendarias'],['legendary','Mythic Actions|Acciones míticas'],['reactions','Reactions|Reacciones'],['actions','Actions|Acciones'],['traits','Traits|Rasgos']];

function splitEntries(txt){

  const c=cat.get(k); if(c){ x.name=c.name; if(c.source==='SRD') x.name+=` (${src})`; }
  else if(m.lang!=='es') x.name=x.en;
  x.id=`imp-${pfx}-${slug(m.id)}-${slug(x.en)}`; x.man=m.id; x._imp.man=m.id; x._imp.title=m.title; return true; });
 WIKI.drop(m.id);

 sec.forEach((s,i)=>{ s.id=`imp-x-${slug(m.id)}-${i}`; s.man=m.id; s.title=m.title; }); WIKI.sec.push(...sec);

 if(!silent) toast(`${m.title}: ${r.mon} monstruos, ${r.spl} hechizos, ${r.itm} objetos y ${r.sec} secciones añadidos a la wiki.`);

}
async function wikiImportAll(ui){

 for(let i=0;i<l.length;i++){ ui&&ui(i/l.length,`Analizando ${l[i].title}…`); await new Promise(r=>setTimeout(r,30)); try{ const r=await wikiImport(l[i],true); if(r) for(const k in tot) tot[k]+=r[k]; }catch(e){ console.error(e); } }

}

 const set=()=>{ curPlane=p.id; document.documentElement.dataset.plane=p.id; $('#plName').textContent=p.name; Ambient.set(p.fx,p.c); lsSet('oz:plane',p.id); render(true); counts(); };
 if(save){ const s=Object.assign({},Store.docs.settings||{},{plane:p.id}); Store.setDoc('settings',s,300); }
 if(from&&!FX.low){ const r=from.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2; GL.portal(x/innerWidth,y/innerHeight);
  const po=$('#portal'); po.classList.remove('go'); po.style.setProperty('--px',x+'px'); po.style.setProperty('--py',y+'px'); po.style.setProperty('--pc',p.c);
  po.innerHTML=`<i class="pr1"></i><i class="pr2"></i><i class="pf"></i><div class="ptitle"><small>Has viajado a</small><b>${esc(p.name)}</b><span>${esc(p.sub)}</span></div>`; void po.offsetWidth; po.classList.add('go');
  clearTimeout(applyPlane.t); setTimeout(set,420); applyPlane.t=setTimeout(()=>{ po.classList.remove('go'); po.innerHTML=''; },2500); }
 else { set(); if(save) toast(`Has viajado a ${p.name}.`); }
};

/* ----- Dado de veinte caras en 3D ----- */
const ICO=(()=>{ const t=(1+Math.sqrt(5))/2, V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(v=>{ const l=Math.hypot(v[0],v[1],v[2]); return v.map(x=>x/l); });
 const F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
 const c=[0,1,2].map(i=>(V[0][i]+V[11][i]+V[5][i])/3), nl=Math.hypot(c[0],c[1],c[2]), n=c.map(x=>x/nl); let up=[0,1,2].map(i=>V[0][i]-c[i]); const ul=Math.hypot(up[0],up[1],up[2]); up=up.map(x=>x/ul);
 const rt=[up[1]*n[2]-up[2]*n[1],up[2]*n[0]-up[0]*n[2],up[0]*n[1]-up[1]*n[0]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
 return {V:V.map(v=>[dot(rt,v),dot(up,v),dot(n,v)]),F}; })();
function drawIco(ctx,S,ax,ay,az,rgb,numA,label){
 const W=ctx.canvas.width, cx=W/2, cy=W/2, sx=Math.sin(ax),cxx=Math.cos(ax),sy=Math.sin(ay),cyy=Math.cos(ay),sz=Math.sin(az),czz=Math.cos(az);
 const P=ICO.V.map(v=>{ let x=v[0],y=v[1],z=v[2]; let y1=y*cxx-z*sx, z1=y*sx+z*cxx; let x2=x*cyy+z1*sy, z2=-x*sy+z1*cyy; return [x2*czz-y1*sz,x2*sz+y1*czz,z2]; });
 ctx.clearRect(0,0,W,W); ctx.lineJoin='round'; ctx.lineWidth=W/190;
 const faces=ICO.F.map(f=>{ const a=P[f[0]],b=P[f[1]],c=P[f[2]]; return {a,b,c,n:[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,(a[2]+b[2]+c[2])/3]}; }).filter(f=>f.n[2]>-.02).sort((p,q)=>p.n[2]-q.n[2]);
 const pr=v=>{ const k=S*(1+v[2]*.16); return [cx+v[0]*k,cy-v[1]*k]; };
 for(const f of faces){ const l=Math.hypot(f.n[0],f.n[1],f.n[2]), s=Math.max(0,(f.n[0]*-.42+f.n[1]*.58+f.n[2]*.7)/l), sp=Math.pow(s,10)*.55;
  const col=rgb.map(c=>Math.round(255*Math.min(1,c*(.16+s*.92)+sp)));
  ctx.beginPath(); const A=pr(f.a),B=pr(f.b),C=pr(f.c); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.closePath();
  ctx.fillStyle=`rgb(${col})`; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.stroke(); }
 if(numA>0){ ctx.globalAlpha=numA; ctx.fillStyle='rgba(18,12,4,.92)'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=`700 ${S*(String(label).length>2?.3:.4)}px 'IBM Plex Mono',monospace`; ctx.fillText(label,cx,cy+S*.03); ctx.globalAlpha=1; }
}
diceFX=function(d20,total){
 if(FX.low) return; $$('.d3,.critring').forEach(x=>x.remove());
 const crit=d20===20, fum=d20===1, rgb=crit?[1,.82,.35]:fum?[.9,.3,.26]:hexRgb(cssVar('--acc'));
 const el=document.createElement('div'); el.className='d3'; if(crit) el.style.setProperty('--dg','rgba(255,204,58,.5)'); if(fum) el.style.setProperty('--dg','rgba(228,92,79,.45)');
 el.innerHTML=`<canvas></canvas>${crit?'<span class="lbl" style="color:#ffe08a">¡Crítico!</span>':fum?'<span class="lbl" style="color:#f7a59c">Pifia</span>':''}`; document.body.append(el);
 const cv=$('canvas',el), dpr=Math.min(devicePixelRatio||1,2); cv.width=cv.height=Math.round(300*dpr); const ctx=cv.getContext('2d'), S=cv.width*.3, T=1050, t0=performance.now();
 const r0=[7+Math.random()*4,6+Math.random()*4,4+Math.random()*3];
 el.animate([{transform:'translate(-50%,-160vh) scale(.45)'},{transform:'translate(-50%,-46%) scale(1.1)',offset:.55},{transform:'translate(-50%,-66%) scale(1)',offset:.74},{transform:'translate(-50%,-50%) scale(1)'}],{duration:T,easing:'cubic-bezier(.3,.6,.4,1)'});
 const frame=now=>{ if(!el.isConnected) return; const k=Math.min(1,(now-t0)/T), e=1-Math.pow(1-k,3), w=1-e;
  drawIco(ctx,S,r0[0]*w,r0[1]*w,r0[2]*w,rgb,Math.max(0,(k-.8)/.2),total); if(k<1) requestAnimationFrame(frame);
  else { if(crit){ const ring=document.createElement('i'); ring.className='critring'; document.body.append(ring); setTimeout(()=>ring.remove(),950);
    for(let i=0;i<34;i++){ const s=document.createElement('i'); s.className='spark'; const a=Math.random()*6.28, d=90+Math.random()*220; s.style.left=innerWidth/2+'px'; s.style.top=innerHeight*.46+'px'; document.body.append(s);
     s.animate([{transform:'translate(0,0) scale(1.4)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) scale(.2)`,opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>s.remove(); } }
   if(fum) el.animate([{transform:'translate(-50%,-50%)'},{transform:'translate(calc(-50% - 12px),-50%) rotate(-3deg)'},{transform:'translate(calc(-50% + 10px),-50%) rotate(3deg)'},{transform:'translate(-50%,-50%)'}],{duration:380});
   setTimeout(()=>{ el.animate([{opacity:1,transform:'translate(-50%,-50%) scale(1)'},{opacity:0,transform:'translate(-50%,-50%) scale(.8)'}],{duration:380,fill:'forwards'}).onfinish=()=>el.remove(); },950); } };
 requestAnimationFrame(frame);
};

/* ----- Rueda de mando (tecla Q o el botón flotante) ----- */
const WHEEL=[['Tirar d20',()=>I.d20,()=>rollToast('1d20','d20')],['Bandeja de dados',()=>I.dice,()=>diceTray()],['Siguiente turno',()=>I.next,()=>{ if(route!=='combate') go('combate'); else nextTurn(); }],['Combate',()=>I.swords,()=>go('combate')],
 ['Buscar',()=>I.search,()=>$('#gq').focus()],['PNJ al azar',()=>I.mask,()=>editNPC(randomNPC())],['Mapas',()=>I.map,()=>go('mapas')],['Cambiar de plano',()=>I.portal,()=>{ scrollTo(0,0); planeMenu(); }]];
const WH={el:null,bg:null,sel:-1,hold:false,x:0,y:0};
function openWheel(x,y,hold){
 closeWheel(); x=innerWidth<380?innerWidth/2:clamp(x,172,innerWidth-172); y=clamp(y,172,innerHeight-172); const R=114;
 const bg=document.createElement('div'); bg.className='wheel-bg'; bg.style.setProperty('--wx',x+'px'); bg.style.setProperty('--wy',y+'px');
 const w=document.createElement('div'); w.className='wheel'; w.style.left=x+'px'; w.style.top=y+'px'; w.setAttribute('role','menu');
 w.innerHTML=`<div class="wheel-ring"></div><div class="wheel-hub"><span id="whl">Rueda de mando</span></div>`+WHEEL.map((it,i)=>{ const a=i/WHEEL.length*Math.PI*2-Math.PI/2; return `<button class="wheel-it" data-w="${i}" role="menuitem" aria-label="${it[0]}" style="--x:${(Math.cos(a)*R).toFixed(1)}px;--y:${(Math.sin(a)*R).toFixed(1)}px;--d:${i*26}ms">${it[1]()}</button>`; }).join('');
 document.body.append(bg,w); Object.assign(WH,{el:w,bg,sel:-1,hold,x,y});
 bg.onclick=closeWheel; w.onclick=e=>{ const b=e.target.closest('[data-w]'); if(b) wheelRun(+b.dataset.w); };
}
function closeWheel(){ if(!WH.el) return; WH.el.remove(); WH.bg.remove(); WH.el=WH.bg=null; WH.sel=-1; }
function wheelMove(e){ const dx=e.clientX-WH.x, dy=e.clientY-WH.y, d=Math.hypot(dx,dy); let i=-1;
 if(d>40){ const n=WHEEL.length; i=Math.round(((Math.atan2(dy,dx)+Math.PI/2)/(Math.PI*2))*n); i=((i%n)+n)%n; }
 if(i===WH.sel) return; WH.sel=i; $$('.wheel-it',WH.el).forEach((b,k)=>b.classList.toggle('sel',k===i)); $('#whl').textContent=i<0?'Rueda de mando':WHEEL[i][0]; }
function wheelRun(i){ const it=WHEEL[i]; closeWheel(); if(it) it[2](); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&WH.el){ closeWheel(); return; }
 if((e.key==='q'||e.key==='Q')&&!e.repeat&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('.modal-bg')){ e.preventDefault(); if(WH.el) closeWheel(); else openWheel(FX.px,FX.py,true); } });
document.addEventListener('keyup',e=>{ if((e.key==='q'||e.key==='Q')&&WH.el&&WH.hold){ if(WH.sel>=0) wheelRun(WH.sel); else WH.hold=false; } });

/* ----- Combate: cinta de iniciativa, daño arrastrando la barra, impactos y cartel de turno ----- */
function vignette(c){ const v=document.createElement('i'); v.className='vig'; v.style.setProperty('--vc',c); document.body.append(v); setTimeout(()=>v.remove(),650); }
function turnBanner(top,name){ if(FX.low) return; $$('.tbanner').forEach(x=>x.remove()); const b=document.createElement('div'); b.className='tbanner'; b.innerHTML=`<small>${esc(top)}</small><b>${esc(name)}</b>`; document.body.append(b); setTimeout(()=>b.remove(),1750); }
function scrub(bar){ bar.title='Arrastra: a la izquierda daña, a la derecha cura';
 bar.addEventListener('pointerdown',e=>{ const row=bar.closest('.cmb'), id=row.dataset.cid, x=CS().list.find(k=>k.id===id); if(!x||!x.max) return; e.preventDefault(); try{ bar.setPointerCapture(e.pointerId); }catch(err){}
  const w=bar.clientWidth, x0=e.clientX, fill=$('i',bar); let n=0; const tip=document.createElement('span'); tip.className='scrub-tip'; tip.style.top=bar.offsetTop+'px'; bar.parentNode.append(tip);
  const mv=ev=>{ n=clamp(Math.round((ev.clientX-x0)/w*x.max),-x.hp,x.max-x.hp); const pct=clamp((x.hp+n)/x.max*100,0,100); tip.textContent=n===0?'0':n>0?'+'+n:'−'+(-n); tip.dataset.s=n<0?'d':n>0?'h':''; tip.style.left=pct+'%'; fill.style.transition='none'; fill.style.width=pct+'%'; };
  const up=()=>{ bar.removeEventListener('pointermove',mv); bar.removeEventListener('pointerup',up); bar.removeEventListener('pointercancel',up); tip.remove(); fill.style.transition='';
   if(n){ $('[name=amt]',row).value=Math.abs(n); hpChange(id,n<0?'dmg':'heal'); } else fill.style.width=clamp(x.hp/x.max*100,0,100)+'%'; };
  bar.addEventListener('pointermove',mv); bar.addEventListener('pointerup',up); bar.addEventListener('pointercancel',up); mv(e); }); }
const _vCombate=vCombate;
vCombate=function(v){ _vCombate(v); const c=CS(); if(!c.list.length) return;
 const strip=document.createElement('div'); strip.className='tl-strip'; strip.setAttribute('aria-label','Orden de iniciativa');
 strip.innerHTML=c.list.map((x,i)=>{ const hp=x.max?clamp(x.hp/x.max,0,1):0; return `<button class="tok ${x.kind} ${i===c.turn&&c.active?'cur':''} ${x.hp<=0?'down':''}" data-tid="${x.id}" title="${esc(x.name)} · iniciativa ${x.init??'–'}" style="--hp:${hp.toFixed(3)};--c:${hp<.3?'var(--bad)':hp<.6?'var(--warn)':'var(--ok)'}"><b>${esc((x.name||'?')[0])}${(x.name.match(/\d+$/)||[''])[0]}</b><small>${x.init??'–'}</small></button>`; }).join('');
 $('.cb-head',v).after(strip);
 strip.onclick=e=>{ const t=e.target.closest('.tok'); if(!t) return; const r=$(`.cmb[data-cid="${t.dataset.tid}"]`); if(!r) return; r.scrollIntoView({block:'center',behavior:FX.low?'auto':'smooth'}); r.animate([{boxShadow:'0 0 0 2px var(--acc2), 0 0 40px var(--glow)'},{boxShadow:'0 0 0 0 transparent'}],{duration:1000}); };
 const cur=$('.tok.cur',strip); if(cur) strip.scrollLeft=cur.offsetLeft-strip.clientWidth/2;
 $$('.cmb .hpbar',v).forEach(scrub);
};
const _hpChange=hpChange;
hpChange=function(id,a){ const x=CS().list.find(k=>k.id===id), before=x?x.hp:0; _hpChange(id,a); if(!x||FX.low) return; const d=before-x.hp, row=$(`.cmb[data-cid="${id}"]`); if(!row||!d) return;
 const r=$('.hpbar',row).getBoundingClientRect(), f=document.createElement('span'); f.className='float'; f.textContent=d>0?'−'+d:'+'+(-d); f.style.cssText=`left:${r.left+r.width/2-14}px;top:${r.top-16}px;color:${d>0?'var(--bad)':'var(--ok)'}`; document.body.append(f); setTimeout(()=>f.remove(),1000);
 if(d>0&&(d>=x.max*.25||x.hp===0)){ row.animate([{transform:'translateX(0)'},{transform:'translateX(-12px) rotate(-.7deg)'},{transform:'translateX(9px) rotate(.5deg)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:440}); vignette(x.hp===0?'rgba(228,92,79,.55)':'rgba(228,92,79,.28)'); }
 else if(d<0) vignette('rgba(115,196,140,.22)');
};
const _nextTurn=nextTurn;
nextTurn=function(){ const c0=CS(), was=c0.active, r0=c0.round; _nextTurn(); const c=CS(), x=c.active&&c.list[c.turn]; if(x) turnBanner(!was?'Comienza el combate':c.round!==r0?`Ronda ${c.round}`:'Turno de',x.name); };

/* ----- Montaje: entrada, selector de efectos y rueda en el botón flotante ----- */
function intro(){ if(FX.low) return; try{ if(sessionStorage.getItem('oz:intro')) return; sessionStorage.setItem('oz:intro','1'); }catch(e){}
 const el=document.createElement('div'); el.className='intro'; el.innerHTML=`<div class="intro-sig">${SIGIL}</div><div class="intro-t">${'OperatorlZ'.split('').map((c,i)=>`<span style="--d:${i*45}ms">${c}</span>`).join('')}</div>`;
 document.body.append(el); setTimeout(()=>el.classList.add('out'),1300); setTimeout(()=>el.remove(),1900); }
const _shell=shell;
shell=function(){ _shell();
 const f=$('.rail-foot'), b=document.createElement('button'); b.className='fxq'; b.id='fxq'; b.title='Cambia la calidad de las animaciones'; f.prepend(b);
 b.onclick=()=>{ FX.q={auto:'alto',alto:'bajo',bajo:'auto'}[FX.q]; FX.auto=false; GL.slow=0; GL.frames=[]; lsSet('oz:fxq',FX.q); fxApply(); fxLabel(); GL.start(); GL.draw(); }; fxLabel();
 f.lastElementChild.insertAdjacentHTML('beforeend',' · <kbd>Q</kbd> rueda');
 const fab=$('#fab'); fab.title='Rueda de mando (Q)'; fab.setAttribute('aria-label','Rueda de mando');
 fab.onclick=()=>{ if(WH.el){ closeWheel(); return; } const r=fab.getBoundingClientRect(); openWheel(r.left+r.width/2-120,r.top+r.height/2-120,false); };
 addEventListener('resize',navInd); intro();
};
