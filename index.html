/* ===== Almacenamiento: db compartido en la nube con respaldo local ===== */
const COLS=['monsters','characters','npcs','maps','manuals','feats','sessions'];
const Store={
 mode:'local',db:null,assets:null,downloads:null,data:{},docs:{},pending:new Set(),subs:new Set(),firstCloud:{},
 init(){
  for(const c of COLS) this.data[c]=lsGet('oz:'+c,{});
  this.docs.combat=lsGet('oz:doc:combat',null); this.docs.settings=lsGet('oz:doc:settings',{});
  this.connect();
 },
 async connect(){
  if(!window.claude||!claude.use) { this.setMode('local'); return; }
  try{
   const [db,assets,downloads]=await Promise.all([claude.use('db'),claude.use('assets').catch(()=>null),claude.use('downloads').catch(()=>null)]);
   this.assets=assets; this.downloads=downloads;
   if(!db){ this.setMode('local'); return; }
   this.db=db; this.setMode('cloud');
   for(const c of COLS){

function roll(expr,adv=0){
 expr=String(expr).replace(/\s+/g,'').replace(/[−–]/g,'-').toLowerCase(); if(!expr) return null;
 const terms=expr.match(/[+-]?[^+-]+/g); if(!terms) return null; let total=0,parts=[],d20=null;
 for(const t of terms){ const sign=t[0]==='-'?-1:1, body=t.replace(/^[+-]/,''); const m=body.match(/^(\d*)d(\d+|%)$/);
  if(m){ const n=Math.min(100,parseInt(m[1]||'1')), s=m[2]==='%'?100:parseInt(m[2]); if(!s) return null; let rs=[];
   if(s===20&&n===1&&adv){ const a=rnd(20),b=rnd(20),p=adv>0?Math.max(a,b):Math.min(a,b); rs=[p]; parts.push(`[${a}, ${b}]→${p}`); d20=p; }
   else { for(let i=0;i<n;i++) rs.push(rnd(s)); parts.push((sign<0?'− ':'')+`[${rs.join(', ')}]`); if(s===20&&n===1) d20=rs[0]; }
   total+=sign*rs.reduce((a,b)=>a+b,0); }
  else if(/^\d+$/.test(body)){ total+=sign*parseInt(body); parts.push((sign<0?'− ':'+ ')+body); }
  else return null; }
 return {total,parts:parts.join(' '),d20,expr};
}
const rollHist=[];
function rollToast(expr,label,adv=0){
 const r=roll(expr,adv); if(!r){ toast('No entiendo esa tirada. Prueba con algo como 2d6+3.','bad'); return null; }
 const cls=r.d20===20?'crit':r.d20===1?'fumble':'';
 rollHist.unshift(`${label?label+' · ':''}${expr} = ${r.total}`); rollHist.length=Math.min(rollHist.length,40);
 toast(`<div class="rt"><b>${r.total}</b><span>${esc(label||expr)}</span></div><small class="muted mono">${esc(expr)}${adv?(adv>0?' · ventaja':' · desventaja'):''} · ${esc(r.parts)}${r.d20===20?' · ¡crítico!':r.d20===1?' · pifia':''}</small>`,cls,true);
 const h=$('#dhist'); if(h) renderHist();
 return r;
}

 const en=e.target.closest('[data-entry]'); if(en){ e.preventDefault(); const [k,id]=en.dataset.entry.split(':'); openEntry(k,id); } });

function planeMenu(){
 const ex=$('.plane-menu'); if(ex){ ex.remove(); return; }
 const m=document.createElement('div'); m.className='plane-menu'; m.setAttribute('role','menu');
 m.innerHTML=`<div class="eyebrow" style="padding:6px 10px">Viajar a otro plano</div>`+PLANES.map(p=>`<button class="${p.id===curPlane?'on':''}" data-p="${p.id}" role="menuitem"><i style="background:${p.c};box-shadow:0 0 12px ${p.c}"></i><span>${p.name}</span><small>${p.sub}</small></button>`).join('');
 $('.plane-pick').append(m);
 m.onclick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; m.remove(); if(b.dataset.p!==curPlane) applyPlane(b.dataset.p,true,$('#planeBtn')); };
 setTimeout(()=>document.addEventListener('click',function off(ev){ if(!m.contains(ev.target)){ m.remove(); document.removeEventListener('click',off);} }),0);
}
function applyPlane(id,save=true,from){
 const p=planeById(id);
 const set=()=>{ curPlane=p.id; document.documentElement.dataset.plane=p.id; $('#plName').textContent=p.name; Ambient.set(p.fx,p.c); lsSet('oz:plane',p.id); render(true); counts(); };
 if(save){ const s=Object.assign({},Store.docs.settings||{},{plane:p.id}); Store.setDoc('settings',s,300); toast(`Has viajado a ${p.name}.`); }
 if(from&&!reduced){ const r=from.getBoundingClientRect(), po=$('#portal');
  po.style.setProperty('--px',(r.left+r.width/2)+'px'); po.style.setProperty('--py',(r.top+r.height/2)+'px'); po.style.setProperty('--pc',p.c);
  po.classList.remove('go'); void po.offsetWidth; po.classList.add('go'); setTimeout(set,480); setTimeout(()=>po.classList.remove('go'),1150); }
 else set();
}

/* ===== Dados con animación ===== */
function diceFX(d20,total){
 if(reduced) return; $$('.dfx').forEach(x=>x.remove());
 const el=document.createElement('div'); el.className='dfx '+(d20===20?'crit':d20===1?'fumble':'');
 el.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round">${DIE[20]}</svg><b>${total}</b>`;
 document.body.append(el); setTimeout(()=>el.classList.add('out'),1500); setTimeout(()=>el.remove(),1950);
 if(d20===20){ setTimeout(()=>{ for(let i=0;i<26;i++){ const s=document.createElement('i'); s.className='spark'; const a=Math.random()*6.28, d=80+Math.random()*160; s.style.left=innerWidth/2+'px'; s.style.top=innerHeight*.44+'px'; document.body.append(s);
  s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>s.remove(); } },650); }
}
const baseRollToast=rollToast;
rollToast=function(expr,label,adv){ const r=baseRollToast(expr,label,adv); if(r&&r.d20!=null) diceFX(r.d20,r.total); return r; };
function renderHist(){ const h=$('#dhist'); if(h) h.innerHTML=rollHist.map(x=>`<div>${esc(x)}</div>`).join('')||'<span class="muted">Aún no hay tiradas.</span>'; }
function diceTray(){
 const ex=$('.tray'); if(ex){ ex.remove(); return; }
 const t=document.createElement('div'); t.className='tray';
 t.innerHTML=`<div class="row" style="justify-content:space-between"><span class="eyebrow">Bandeja de dados</span><button class="btn ghost icon sm" data-close aria-label="Cerrar">${I.x}</button></div>
 <div class="dres" id="dres">d20</div>
 <div class="dice">${[4,6,8,10,12,20,100].map(n=>`<button class="die" data-d="${n}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${DIE[n]}</svg>d${n}</button>`).join('')}<button class="die" data-adv="1"><b style="font-size:1.1rem">V</b>ventaja</button></div>
 <div class="row" style="flex-wrap:nowrap"><input class="inp mono" id="dexpr" placeholder="2d6+3, 1d20+5…" aria-label="Expresión de dados"><button class="btn pri" id="dgo">Tirar</button></div>
 <div class="row" style="margin:8px 0;gap:6px"><span class="chip" data-adv="-1">Desventaja</span><span class="chip" data-x="4d6">4d6</span><span class="chip" data-x="2d20">2d20</span><span class="chip" data-x="1d100">d100</span></div>
 <div class="dhist" id="dhist"></div>`;
 document.body.append(t); renderHist();
 const out=$('#dres',t);
 const doRoll=(expr,adv=0)=>{ const r=roll(expr,adv); if(!r){ out.textContent='¿?'; return; }
  let k=0; const anim=setInterval(()=>{ out.textContent=rnd(Math.max(4,Math.abs(r.total)||6)); if(++k>9){ clearInterval(anim); out.textContent=r.total; out.style.color=r.d20===20?'#ffe08a':r.d20===1?'var(--bad)':''; } },reduced?0:40);
  if(r.d20!=null) diceFX(r.d20,r.total);
  rollHist.unshift(`${expr}${adv?(adv>0?' (V)':' (D)'):''} = ${r.total}  ${r.parts}`); renderHist(); };
 t.addEventListener('click',e=>{ const d=e.target.closest('[data-d]'); if(d) doRoll('1d'+d.dataset.d);
  const a=e.target.closest('[data-adv]'); if(a) doRoll('1d20',Number(a.dataset.adv));
  const x=e.target.closest('[data-x]'); if(x) doRoll(x.dataset.x); if(e.target.closest('[data-close]')) t.remove(); });
 $('#dgo',t).onclick=()=>doRoll($('#dexpr',t).value);
 $('#dexpr',t).onkeydown=e=>{ if(e.key==='Enter') doRoll(e.target.value); if(e.key==='Escape') t.remove(); };
}

/* ===== Fuentes de la wiki ===== */
const KINDS={monster:'Monstruo',spell:'Hechizo',species:'Especie',feat:'Dote',cond:'Condición',rule:'Regla',cls:'Clase'};
function allSpells(){ return [...SPELLS,...SPELL_CAT]; }
function allSpecies(){ return [...SPECIES,...SPECIES_CAT]; }
function allMonsterEntries(){ return [...allMonsters(),...MONSTER_CAT]; }
function findEntry(k,id){
 if(k==='monster') return allMonsterEntries().find(x=>x.id===id);
 if(k==='spell') return allSpells().find(x=>x.id===id);
 if(k==='species') return allSpecies().find(x=>x.id===id);
 if(k==='feat') return allFeats().find(x=>x.id===id);
 if(k==='cond'){ const c=CONDITIONS[+id]; return c&&{id,name:c[0],desc:c[1],source:'Reglas 2024',full:true}; }
 return null;
}
const srcTag=x=>x.source==='Homebrew'?'<span class="tag hb">Homebrew</span>':x._mod?'<span class="tag mod">Modificado</span>':x.full===false?`<span class="tag ix" title="${esc(bookName(x.source))}">${esc(x.source)}</span>`:`<span class="tag" title="${esc(bookName(x.source))}">${esc(x.source==='SRD'?'SRD 5.1':x.source)}</span>`;

/* ===== Panel lateral de fichas ===== */
const DR={stack:[]};
function openEntry(k,id,push=true){
 if(k==='cls'){ CL.sel=id; closeDrawer(true); go('clases'); return; }
 const x=findEntry(k,id); if(!x){ toast('No encontré esa ficha.'); return; }
 if(push){ if(!(DR.stack.length&&DR.stack[DR.stack.length-1].k===k&&DR.stack[DR.stack.length-1].id===id)) DR.stack.push({k,id}); } else if(!DR.stack.length) DR.stack.push({k,id});
 const rec=lsGet('oz:recent',[]).filter(r=>!(r.k===k&&r.id===id)); rec.unshift({k,id}); lsSet('oz:recent',rec.slice(0,12));
 let dr=$('.drawer');
 if(!dr){ const bg=document.createElement('div'); bg.className='drawer-bg'; bg.onclick=()=>closeDrawer(); dr=document.createElement('aside'); dr.className='drawer'; dr.setAttribute('role','dialog'); dr.setAttribute('aria-modal','true'); document.body.append(bg,dr); }
 const pins=(Store.docs.settings||{}).pins||[], pinned=pins.some(p=>p.k===k&&p.id===id);
 dr.innerHTML=`<header><button class="btn ghost icon" id="drBack" aria-label="Atrás" ${DR.stack.length>1?'':'hidden'}>${I.back}</button><span class="k">${KINDS[k]}</span>
  <button class="btn ghost icon" id="drPin" title="${pinned?'Quitar de la Mesa':'Fijar en la Mesa'}" aria-label="Fijar en la Mesa">${pinned?I.pinOn:I.pinOff}</button><button class="btn ghost icon" id="drX" aria-label="Cerrar">${I.x}</button></header><div class="db" id="drBody"></div>`;
 const b=$('#drBody',dr); b.innerHTML=entryHTMLFor(k,x);
 $('#drX',dr).onclick=()=>closeDrawer(); $('#drBack',dr).onclick=()=>{ DR.stack.pop(); const t=DR.stack[DR.stack.length-1]; if(t) openEntry(t.k,t.id,false); };
 $('#drPin',dr).onclick=()=>{ const s=Object.assign({},Store.docs.settings||{}); s.pins=(s.pins||[]).filter(p=>!(p.k===k&&p.id===id)); if(!pinned) s.pins.unshift({k,id}); Store.setDoc('settings',s,300); toast(pinned?'Quitado de la Mesa.':'Fijado en la Mesa.'); openEntry(k,id,false); if(route==='mesa') render(true); };
 bindEntry(b,k,x);
}
function closeDrawer(instant){ DR.stack=[]; const d=$('.drawer'), bg=$('.drawer-bg'); if(!d) return; if(instant||reduced){ d.remove(); bg&&bg.remove(); return; } d.classList.add('out'); bg&&(bg.style.opacity=0,bg.style.transition='opacity .25s'); setTimeout(()=>{ d.remove(); bg&&bg.remove(); },280); }
const manualBtn=q=>`<button class="btn" data-manual="${esc(q)}">${I.book} Buscar en mis manuales</button>`;
const beyondBtn=en=>`<a class="btn" href="https://www.dndbeyond.com/search?q=${encodeURIComponent(en)}" target="_blank" rel="noopener">${I.ext} D&D Beyond</a>`;
const ixNote=x=>`<div class="ixnote"><b>${esc(bookName(x.source))}</b><br>Este contenido pertenece a un libro con derechos reservados, así que aquí solo aparece su ficha de índice. Sube ese libro a Manuales y el botón "Buscar en mis manuales" te lleva directo a la página.</div>`;
function entryHTMLFor(k,x){
 if(k==='monster'){
  if(x.full===false) return `<div class="sb"><h2>${esc(x.name)}</h2><div class="ty">${esc(x.type)} · <span class="muted">${esc(x.en)}</span></div><div class="facts"><div><small>Desafío</small>${esc(x.cr)} (${(CR_XP[x.cr]||0).toLocaleString('es')} PX)</div><div><small>Fuente</small>${esc(bookName(x.source))}</div></div></div>${ixNote(x)}<div class="acts" style="margin-top:14px">${manualBtn(x.name)}${beyondBtn(x.en)}<button class="btn" id="mkHB">${I.plus} Crear versión homebrew</button></div>`;
  return `<div class="acts"><input class="inp" id="bqty" type="number" min="1" max="20" value="1" style="width:68px" aria-label="Cantidad"><button class="btn pri" id="badd">${I.swords} Al combate</button><button class="btn" id="bedit">${I.edit} ${x.source==='SRD'?'Modificar':'Editar'}</button><button class="btn" id="bdup">${I.copy} Duplicar</button>${x._mod?`<button class="btn" id="breset">${I.undo} Restaurar</button>`:''}${x.source!=='SRD'?`<button class="btn danger" id="bdel">${I.trash}</button>`:''}</div>${statblock(x)}<div class="acts" style="margin-top:16px">${manualBtn(x.name)}</div>`;
 }
 if(k==='spell'){
  const lv=x.level===0?'Truco':`Nivel ${x.level}`;
  return `<div class="sb"><h2>${esc(x.name)}</h2><div class="ty">${lv} · ${esc((x.school||'').toLowerCase())}${x.ritual?' (ritual)':''} · <span class="muted">${esc(x.en)}</span></div>
  ${x.full?`<div class="facts"><div><small>Tiempo</small>${esc(x.time)}</div><div><small>Alcance</small>${esc(x.range)}</div><div><small>Componentes</small>${esc(x.comp)}</div><div><small>Duración</small>${x.conc?'Concentración, ':''}${esc(x.dur)}</div></div><p style="font-size:1.04rem">${rollify(x.desc)}</p>
  <h4>Clases</h4><div class="row" style="gap:6px">${x.classes.map(c=>`<span class="chip" data-spcls="${esc(c)}">${esc(c)}</span>`).join('')}</div>`:''}
  <div class="row" style="margin-top:14px;gap:8px">${srcTag(x)}<small class="muted">${esc(bookName(x.source))}</small></div></div>
  ${x.full?'':`<div style="margin-top:12px">${ixNote(x)}</div>`}<div class="acts" style="margin-top:14px">${manualBtn(x.name)}${x.full?'':beyondBtn(x.en)}</div>`;
 }
 if(k==='species'){
  return `<div class="sb"><h2>${esc(x.name)}</h2><div class="ty">${x.full?`${esc(x.size)} · velocidad ${esc(x.speed)}`:esc(x.desc)} · <span class="muted">${esc(x.en)}</span></div>
  ${x.full?x.traits.map(t=>`<p><b>${esc(t[0])}.</b> ${esc(t[1])}</p>`).join(''):ixNote(x)}<div class="row" style="margin-top:14px;gap:8px">${srcTag(x)}<small class="muted">${esc(bookName(x.source))}</small></div></div><div class="acts" style="margin-top:14px">${manualBtn(x.name)}${x.full?'':beyondBtn(x.en)}</div>`;
 }
 if(k==='feat'){
  const lbl=Object.fromEntries(FEAT_CATS);
  return `<div class="sb"><h2>${esc(x.name)}</h2><div class="ty">${esc(lbl[x.cat]||x.cat)}${x.en?` · <span class="muted">${esc(x.en)}</span>`:''}</div>${x.pre?`<p><b>Requisito.</b> ${esc(x.pre)}</p>`:''}<p style="font-size:1.04rem">${esc(x.desc)}</p><div class="row" style="margin-top:14px;gap:8px">${srcTag(x)}</div></div>
  <div class="acts" style="margin-top:14px">${manualBtn(x.name)}${x.source==='Homebrew'?`<button class="btn" id="fedit">${I.edit} Editar</button>`:''}</div>`;
 }
 if(k==='cond') return `<div class="sb"><h2>${esc(x.name)}</h2><p style="font-size:1.06rem">${esc(x.desc)}</p></div><div class="acts" style="margin-top:14px">${manualBtn(x.name)}</div>`;
 return '';
}
function bindEntry(b,k,x){
 $$('[data-manual]',b).forEach(btn=>btn.onclick=()=>{ LB.q=btn.dataset.manual; LB.open=null; closeDrawer(); go('biblioteca'); });
 $$('[data-spcls]',b).forEach(c=>c.onclick=()=>{ WS.hechizos={q:'',f:{cls:c.dataset.spcls}}; closeDrawer(); go('hechizos'); });
 if(k==='monster'){
  $('#mkHB',b)?.addEventListener('click',()=>{ closeDrawer(true); editMonster(null); setTimeout(()=>{ const n=$('#f-name'); if(n){ n.value=x.name; $('#f-cr').value=x.cr; $('#f-type').value=x.type; $('#f-en').value=x.en; } },60); });
  if($('#badd',b)) $('#badd',b).onclick=()=>{ const q=clamp(Number($('#bqty',b).value)||1,1,20); addMonstersToCombat(x,q); toast(`${q} × ${x.name} añadido al combate.`); };
  $('#bedit',b)?.addEventListener('click',()=>editMonster(x));
  $('#bdup',b)?.addEventListener('click',()=>{ const c=clone(x); delete c._mod; c.id='hb-'+uid(); c.name=x.name+' (variante)'; c.source='Homebrew'; Store.put('monsters',c); openEntry('monster',c.id); editMonster(c); });
  $('#breset',b)?.addEventListener('click',()=>confirmBox(`¿Volver a la versión oficial de ${x.name}?`,()=>{ Store.del('monsters',x.id); openEntry('monster',x.id,false); },'Restaurar'));
  $('#bdel',b)?.addEventListener('click',()=>confirmBox(`¿Eliminar ${x.name}?`,()=>{ Store.del('monsters',x.id); closeDrawer(); if(route==='bestiario') render(true); }));
 }
 if(k==='feat') $('#fedit',b)?.addEventListener('click',()=>{ closeDrawer(true); editFeat(Store.get('feats',x.id)); });
}

/* ===== Buscador global ===== */
function searchIndex(){
 const it=[];
 for(const [k,r] of Object.entries(ROUTES)) it.push({g:'Secciones',t:r.t,s:r.s,a:()=>go(k)});
 for(const m of allMonsterEntries()) it.push({g:'Monstruos',t:m.name,s:`${m.en||''} · VD ${m.cr}`,tag:m,a:()=>openEntry('monster',m.id)});
 for(const x of allSpells()) it.push({g:'Hechizos',t:x.name,s:`${x.en} · ${x.level?'Nv '+x.level:'Truco'}`,tag:x,a:()=>openEntry('spell',x.id)});
 for(const x of allSpecies()) it.push({g:'Especies',t:x.name,s:x.en,tag:x,a:()=>openEntry('species',x.id)});
 for(const c of CLASSES) it.push({g:'Clases',t:c.name,s:c.en,a:()=>openEntry('cls',c.id)});
 for(const [cid,str] of Object.entries(SUBCLASS_CAT)) for(const s of str.split(';')){ const [n,src]=s.split('|'); it.push({g:'Subclases',t:n,s:`${CLASSES.find(c=>c.id===cid).name} · ${src}`,a:()=>openEntry('cls',cid)}); }
 for(const f of allFeats()) it.push({g:'Dotes',t:f.name,s:f.en,tag:f,a:()=>openEntry('feat',f.id)});
 CONDITIONS.forEach((c,i)=>it.push({g:'Reglas',t:c[0],s:'Condición',a:()=>openEntry('cond',String(i))}));
 for(const [sec,list] of RULES) for(const [n] of list) it.push({g:'Reglas',t:n,s:sec,a:()=>go('reglas')});
 for(const c of Store.list('characters')) it.push({g:'Campaña',t:c.name||'Sin nombre',s:'Personaje',a:()=>editPC(c)});
 for(const n of Store.list('npcs')) it.push({g:'Campaña',t:n.name||'Sin nombre',s:'PNJ · '+(n.role||''),a:()=>editNPC(n)});
 for(const m of Store.list('maps')) it.push({g:'Campaña',t:m.name,s:'Mapa '+LEVELS[m.level].name.toLowerCase()+' · '+planeById(m.plane||'material').name,a:()=>{ if((m.plane||'material')!==curPlane) applyPlane(m.plane||'material',true); MS.open=m.id; go('mapas'); }});
 for(const m of Store.list('manuals')) it.push({g:'Campaña',t:m.title,s:'Manual',a:()=>{ LB.open=m.id; LB.page=0; go('biblioteca'); }});
 return it;
}
function initSearch(){
 const q=$('#gq'), box=$('#gs'); let idx=null, cur=[], sel=0, res=null;
 const close=()=>{ res&&res.remove(); res=null; };
 const draw=()=>{ const s=norm(q.value.trim()); if(!idx) idx=searchIndex();
  if(!res){ res=document.createElement('div'); res.className='gres'; box.append(res); res.addEventListener('mousedown',e=>e.preventDefault()); res.addEventListener('click',e=>{ const r=e.target.closest('[data-n]'); if(r) pickR(+r.dataset.n); }); }
  if(!s){ const rec=lsGet('oz:recent',[]).map(r=>{ const x=findEntry(r.k,r.id); return x&&{g:'Recientes',t:x.name,s:KINDS[r.k],a:()=>openEntry(r.k,r.id)}; }).filter(Boolean);
   cur=rec.length?rec:idx.filter(i=>i.g==='Secciones'); }
  else { const sc=i=>{ const n=norm(i.t); return n.startsWith(s)?0:n.includes(s)?1:norm(i.s||'').includes(s)?2:9; };
   cur=idx.map(i=>[sc(i),i]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||a[1].t.length-b[1].t.length).slice(0,60).map(a=>a[1]);
   const order=['Secciones','Monstruos','Hechizos','Especies','Clases','Subclases','Dotes','Reglas','Campaña']; cur.sort((a,b)=>order.indexOf(a.g)-order.indexOf(b.g)); }
  if(s.length>1) cur.push({g:'Manuales',t:`Buscar «${q.value.trim()}» en mis manuales`,s:'Texto completo de tus PDF',a:()=>{ LB.q=q.value.trim(); LB.open=null; go('biblioteca'); }});
  sel=clamp(sel,0,cur.length-1); let last='';
  res.innerHTML=cur.map((i,n)=>{ const h=i.g!==last?`<div class="grp">${i.g}</div>`:''; last=i.g; return h+`<div class="r ${n===sel?'sel':''}" data-n="${n}"><span class="t">${esc(i.t)}</span>${i.s?`<small>${esc(i.s.slice(0,46))}</small>`:''}${i.tag&&i.tag.full===false?`<span class="tag ix">${esc(i.tag.source)}</span>`:''}</div>`; }).join('')||'<div class="muted" style="padding:12px">Sin resultados.</div>';
  const se=$('.r.sel',res); se&&se.scrollIntoView({block:'nearest'}); };
 const pickR=n=>{ const i=cur[n]; if(!i) return; q.value=''; q.blur(); close(); i.a(); };
 q.addEventListener('focus',()=>{ idx=searchIndex(); sel=0; draw(); });
 q.addEventListener('input',()=>{ sel=0; draw(); });
 q.addEventListener('blur',()=>setTimeout(close,120));
 q.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){ sel++; draw(); e.preventDefault(); } else if(e.key==='ArrowUp'){ sel=Math.max(0,sel-1); draw(); e.preventDefault(); } else if(e.key==='Enter'){ pickR(sel); } else if(e.key==='Escape'){ q.value=''; q.blur(); } });
}

/* ===== Lista genérica de la wiki ===== */
const WS={};
function wikiList(v,cfg){
 const st=WS[cfg.key]=WS[cfg.key]||{q:'',f:{}};
 const all=cfg.items(); const nFull=all.filter(x=>x.full!==false).length;
 v.innerHTML=`<div class="wrap"><div class="wl-head" style="--i:0"><div class="grow"><span class="eyebrow">${cfg.eyebrow}</span><h2 class="h1">${cfg.title}</h2><p class="muted" style="margin:6px 0 0">${nFull} con ficha completa · ${all.length-nFull} en el índice de manuales y expansiones</p></div>${cfg.create?`<button class="btn pri" id="wcreate">${I.plus} ${cfg.create.label}</button>`:''}</div>
  <div class="panel" style="--i:1;padding:14px"><div class="row"><div class="search">${I.search}<input class="inp" id="wq" placeholder="Filtrar ${cfg.title.toLowerCase()}…" value="${esc(st.q)}" aria-label="Filtrar"></div>
  <div class="filters">${cfg.filters.map(f=>`<select class="sel" data-f="${f.id}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}</option>${f.opts().map(o=>{const [val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(st.f[f.id]??'')===String(val)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`).join('')}
  <span class="chip ${st.f.full?'on':''}" id="wfull">Solo ficha completa</span><span class="chip" id="wclear">Limpiar</span></div></div></div>

function loadPdfJs(){

 return pdfReady;
}
function linesToBlocks(lines,med){
 const out=[]; let para=null, prev=null;
 for(const l of lines){ if(/^\d{1,4}$/.test(l.text)) continue;
  const isH=l.size>=med*1.22&&l.text.length<90&&/\p{L}/u.test(l.text);
  if(isH){ if(para){ out.push(['p',para]); para=null; } const last=out[out.length-1];
   if(last&&last[0]==='h'&&prev&&prev.isH&&Math.abs(prev.y-l.y)<l.size*1.9) last[1]+=' '+l.text; else out.push(['h',l.text]);
   prev=Object.assign({},l,{isH:true}); continue; }
  const gap=prev?prev.y-l.y:0;
  const brk=!para||!prev||prev.isH||gap>l.size*1.8||gap<-l.size*2;
  if(brk){ if(para) out.push(['p',para]); para=l.text; } else para=/[-‐]$/.test(para)?para.replace(/[-‐]$/,'')+l.text:para+' '+l.text;
  prev=l; }
 if(para) out.push(['p',para]); return out;
}
async function parsePdf(file,prog){
 await loadPdfJs();
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;
 const raw=[], sizes={};
 for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); const lines=[]; let cur=null;
  const flush=()=>{ if(cur&&cur.text.trim()){ cur.text=cur.text.replace(/\s+/g,' ').trim(); lines.push(cur); const k=Math.round(cur.size); sizes[k]=(sizes[k]||0)+cur.text.length; } cur=null; };
  for(const it of tc.items){ if(typeof it.str!=='string') continue; const t=it.transform, size=Math.hypot(t[2],t[3])||it.height||10, x=t[4], y=t[5];
   if(it.str!==''){ if(cur&&Math.abs(y-cur.y)<Math.max(size,cur.size)*0.55){ const gap=x-cur.xe; cur.text+=(gap>size*0.12&&!/\s$/.test(cur.text)&&!/^\s/.test(it.str)?' ':'')+it.str; cur.xe=x+(it.width||0); cur.size=Math.max(cur.size,size); }
    else { flush(); cur={text:it.str,x,y,xe:x+(it.width||0),size}; } }
   if(it.hasEOL) flush(); }
  flush(); raw.push(lines); pg.cleanup&&pg.cleanup(); prog(i/pdf.numPages,`Página ${i} de ${pdf.numPages}`);
  if(i%4===0) await new Promise(r=>setTimeout(r)); }
 const med=Number(Object.entries(sizes).sort((a,b)=>b[1]-a[1])[0]?.[0])||10;

}
function parseText(txt,md){
 const blocks=[]; let para=[];
 const fl=()=>{ if(para.length){ blocks.push(['p',para.join(' ')]); para=[]; } };
 for(const ln of txt.split(/\r?\n/)){ const s=ln.trim(); if(!s){ fl(); continue; } const h=md&&s.match(/^#{1,4}\s+(.*)/); if(h){ fl(); blocks.push(['h',h[1]]); } else para.push(s.replace(/^[-*]\s+/,'• ')); }
 fl(); const pages=[]; let cur=[], n=0;
 for(const b of blocks){ cur.push(b); n+=b[1].length; if(n>3200){ pages.push(cur); cur=[]; n=0; } } if(cur.length) pages.push(cur);

}
function parseHTML(html){ const d=new DOMParser().parseFromString(html,'text/html'); const out=[];

async function importFiles(files,ui){

   if(ext==='pdf'||file.type==='application/pdf') content=await parsePdf(file,(p,t)=>ui(p,`${file.name}: ${t}`));
   else if(ext==='html'||ext==='htm') content=parseHTML(await file.text());
   else if(['txt','md','markdown'].includes(ext)) content=parseText(await file.text(),ext!=='txt');
   else { toast(`${file.name}: solo se aceptan PDF, TXT, MD o HTML.`,'bad'); continue; }
   const chars=content.pages.reduce((s,p)=>s+p.reduce((a,b)=>a+b[1].length,0),0);
   if(chars<40){ toast(`${file.name} no tiene texto seleccionable (parece escaneado). Pasa el PDF por un OCR y vuelve a subirlo.`,'bad'); continue; }
   const meta={id:'man-'+uid(),title:name,pages:content.pages.length,chars,color:pick(BOOK_COLORS),added:Date.now(),file:file.name};

 <div class="maplist">${maps.map(x=>`<div class="li ${x.id===MS.open?'on':''}" data-open="${x.id}"><img alt="" src="${thumb(x)}" style="width:44px;height:28px;border-radius:4px;image-rendering:pixelated;object-fit:cover;flex:none"><span class="nm">${esc(x.name)}</span>${x.parent?'<span class="tag">sub</span>':''}</div>`).join('')||'<small class="muted">No hay mapas de este nivel en este plano.</small>'}
  <button class="btn sm" id="mnew" style="margin-top:4px">${I.plus} Nuevo mapa ${LEVELS[lv].name.toLowerCase()}</button></div>
 ${m?`<div><span class="eyebrow">Herramientas</span><div class="tools" style="margin-top:6px">${tools.map(t=>`<button class="tool ${MS.tool===t[0]?'on':''}" data-tool="${t[0]}" title="${t[1]} (${t[3]})">${t[2]}${t[1]}</button>`).join('')}<button class="tool" id="mundo2" title="Deshacer (Ctrl+Z)">${I.undo}Deshacer</button></div></div>
  ${['pincel','region'].includes(MS.tool)?`<div class="row" style="gap:6px"><small class="muted">Tamaño</small>${[1,2,3,5,8].map(n=>`<span class="chip ${MS.brush===n?'on':''}" data-br="${n}">${n}</span>`).join('')}</div>`:''}
  ${['pincel','rellenar'].includes(MS.tool)?`<div><span class="eyebrow">Terreno</span><div class="swatches" style="margin-top:6px">${TERR[m.level].map(([k,n,c])=>`<button class="sw ${MS.ter[m.level]===k?'on':''}" data-ter="${k}"><i style="background:${c}"></i><span>${n}</span></button>`).join('')}</div></div>`:''}
  ${MS.tool==='region'?`<div><span class="eyebrow">Regiones y zonas</span><div style="display:flex;flex-direction:column;gap:5px;margin-top:6px">${m.regions.map((r,i)=>`<div class="sw ${MS.reg===i?'on':''}" data-reg="${i}" style="cursor:pointer"><i style="background:${r.color}"></i><input class="inp" data-rn="${i}" value="${esc(r.name)}" style="padding:3px 6px;font-size:.82rem" aria-label="Nombre de la región"><button class="btn ghost icon sm" data-rdel="${i}" aria-label="Eliminar región">${I.x}</button></div>`).join('')}
   <button class="sw ${MS.reg<0?'on':''}" data-reg="-1"><i style="background:transparent;border:1px dashed var(--line2)"></i><span>Borrar región</span></button><button class="btn sm" id="radd">${I.plus} Nueva región</button></div></div>`:''}
  ${MS.tool==='marcador'?`<div><span class="eyebrow">Tipo de lugar</span><div class="swatches" style="margin-top:6px">${MARK[m.level].map(([k,n])=>`<button class="sw ${MS.mk[m.level]===k?'on':''}" data-mk="${k}"><canvas width="32" height="32" data-ico="${k}" style="width:16px;height:16px"></canvas><span>${n}</span></button>`).join('')}</div><small class="muted" style="display:block;margin-top:6px">Clic en el mapa para colocar. Un lugar puede abrir un submapa.</small></div>`:''}
  ${MS.tool==='regla'?`<small class="muted">Arrastra para medir. ${m.level==='minimo'?'En mapas mínimos cada diagonal cuenta como una casilla.':'Incluye días de viaje a ritmo normal (unos 38 km por día).'}</small>`:''}
  ${MS.tool==='mover'?`<small class="muted">Arrastra para desplazarte. Clic en un lugar o texto para editarlo; Supr lo elimina. Rueda o pellizco para zoom.</small>`:''}
  <hr class="rule" style="margin:4px 0"><div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Este mapa</span>
   <input class="inp" id="mname" value="${esc(m.name)}" aria-label="Nombre del mapa">
   <div class="row" style="flex-wrap:nowrap;gap:6px"><small class="muted" style="white-space:nowrap">1 casilla =</small><input class="inp mono" id="mscale" type="number" step="0.1" min="0.1" value="${m.scale}" style="width:80px" aria-label="Escala"><select class="sel" id="munit" style="width:auto" aria-label="Unidad">${['m','km','mi','pies'].map(u=>`<option ${u===m.unit?'selected':''}>${u}</option>`).join('')}</select></div>
   <div class="row" style="flex-wrap:nowrap;gap:6px"><input class="inp mono" id="mw" type="number" min="8" max="120" value="${m.w}" style="width:68px" aria-label="Ancho"><span class="muted">×</span><input class="inp mono" id="mh" type="number" min="8" max="120" value="${m.h}" style="width:68px" aria-label="Alto"><button class="btn sm" id="mres">Redimensionar</button></div>
   <select class="sel" id="mplane" aria-label="Plano del mapa">${PLANES.map(p=>`<option value="${p.id}" ${p.id===(m.plane||'material')?'selected':''}>${p.name}</option>`).join('')}</select>
   <div class="row" style="gap:6px"><button class="btn sm" id="mgen">${I.wand} Generar terreno</button><button class="btn sm danger" id="mdel">${I.trash} Eliminar</button></div></div>`:''}`;
 $$('canvas[data-ico]',s).forEach(c=>{ const x=c.getContext('2d'); x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc'); iconPath(x,c.dataset.ico,16,16,13); });
 s.onclick=e=>{ const t=e.target;
  const lvb=t.closest('[data-lv]'); if(lvb){ MS.level=lvb.dataset.lv; if(Ed.map&&Ed.map.level===MS.level){ sideRender(); return; } if(Ed.map) saveMap(0); openMap(null); return; }
  const o=t.closest('[data-open]'); if(o){ if(Ed.map) saveMap(0); openMap(o.dataset.open); return; }
  if(t.closest('#mnew')){ newMapDialog(); return; }
  const tl=t.closest('[data-tool]'); if(tl){ MS.tool=tl.dataset.tool; Ed.ruler=null; Ed.sel=null; closePop(); sideRender(); requestDraw(); return; }
  if(t.closest('#mundo2')){ doUndo(); return; }
  const br=t.closest('[data-br]'); if(br){ MS.brush=+br.dataset.br; sideRender(); return; }
  const te=t.closest('[data-ter]'); if(te){ MS.ter[Ed.map.level]=te.dataset.ter; sideRender(); return; }
  const rd=t.closest('[data-rdel]'); if(rd){ const i=+rd.dataset.rdel; pushUndo(); const ch=String.fromCharCode(65+i); Ed.map.regions.splice(i,1);
   Ed.map.r=Ed.map.r.split('').map(c=>c==='.'?c:c===ch?'.':c>ch?String.fromCharCode(c.charCodeAt(0)-1):c).join(''); MS.reg=Math.min(MS.reg,Ed.map.regions.length-1); rebuildRegions(); saveMap(); sideRender(); requestDraw(); return; }
  const rg=t.closest('[data-reg]'); if(rg&&!t.matches('input')){ MS.reg=+rg.dataset.reg; sideRender(); return; }
  if(t.closest('#radd')){ if(Ed.map.regions.length>=26) return toast('Máximo 26 regiones por mapa.'); const n=Ed.map.regions.length; Ed.map.regions.push({name:(Ed.map.level==='global'?'Reino ':Ed.map.level==='nacional'?'Comarca ':'Barrio ')+(n+1),color:REGION_COLORS[n%REGION_COLORS.length]}); MS.reg=n; saveMap(); sideRender(); return; }
  const mk=t.closest('[data-mk]'); if(mk){ MS.mk[Ed.map.level]=mk.dataset.mk; sideRender(); return; }
  if(t.closest('#mres')){ const w=clamp(+$('#mw').value||Ed.map.w,8,120), h=clamp(+$('#mh').value||Ed.map.h,8,120); resizeMap(w,h); return; }
  if(t.closest('#mgen')){ confirmBox('¿Generar terreno nuevo? Reemplaza el terreno actual (puedes deshacer).',()=>{ pushUndo(); Ed.map.t=generateTerrain(Ed.map,(Math.random()*1e6)|0); rebuildTerrain(); saveMap(); requestDraw(); sideRender(); },'Generar'); return; }
  if(t.closest('#mdel')){ confirmBox(`¿Eliminar el mapa "${Ed.map.name}"? Los submapas se conservan.`,()=>{ const id=Ed.map.id; Ed.map=null; Store.del('maps',id); openMap(null); }); return; }
 };
 const nm=$('#mname',s); if(nm) nm.oninput=e=>{ Ed.map.name=e.target.value||'Sin nombre'; saveMap(); crumbs(); };
 $('#mscale',s)?.addEventListener('change',e=>{ Ed.map.scale=Number(e.target.value)||1; saveMap(); info({x:-1,y:-1}); });
 $('#munit',s)?.addEventListener('change',e=>{ Ed.map.unit=e.target.value; saveMap(); info({x:-1,y:-1}); });
 $('#mplane',s)?.addEventListener('change',e=>{ Ed.map.plane=e.target.value; saveMap(0); toast(`Mapa movido a ${planeById(e.target.value).name}.`); openMap(null); counts(); });
 $$('[data-rn]',s).forEach(i=>i.oninput=()=>{ Ed.map.regions[+i.dataset.rn].name=i.value; rebuildRegions(); saveMap(); requestDraw(); });
}
function resizeMap(w,h){ const m=Ed.map; pushUndo(); const base=LEVELS[m.level].base; let t='',r='';
 for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const ok=x<m.w&&y<m.h; t+=ok?m.t[y*m.w+x]:base; r+=ok?m.r[y*m.w+x]:'.'; }
 m.w=w; m.h=h; m.t=t; m.r=r; m.labels=(m.labels||[]).filter(l=>l.x<w&&l.y<h); m.markers=(m.markers||[]).filter(k=>k.x<w&&k.y<h);
 rebuildTerrain(); rebuildRegions(); saveMap(); fitView(); sideRender(); }
function newMapDialog(parent,fromMarker){
 const lv=parent?LEVELS[parent.level].child:MS.level, L=LEVELS[lv];
 const md=modal({title:'Nuevo mapa '+L.name.toLowerCase(),body:`<p class="muted" style="margin:0">${L.desc}. Se crea en ${esc(planeById(curPlane).name)}.</p>
  <div class="grid2">${fld('Nombre','name',fromMarker?.name||(lv==='global'?'Mundo conocido':lv==='nacional'?'Nueva región':'Nuevo pueblo'))}${sel('Nivel','level',lv,Object.entries(LEVELS).map(([k,l])=>[k,l.name]))}</div>
  <div class="grid3">${fld('Ancho (casillas)','w',L.w,'number','min="8" max="120"')}${fld('Alto (casillas)','h',L.h,'number','min="8" max="120"')}${fld(`Escala (${L.unit} por casilla)`,'scale',L.scale,'number','step="0.1" min="0.1"')}</div>
  <label class="chip" style="cursor:pointer;width:max-content"><input type="checkbox" name="gen" ${lv!=='minimo'?'checked':''}> Generar terreno procedural para empezar</label>`,
  foot:`<button class="btn" data-c>Cancelar</button><button class="btn pri" data-s>${I.plus} Crear</button>`});
 $('[data-c]',md.el).onclick=md.close;
 $('[data-s]',md.el).onclick=()=>{ const f=vals(md.el); const level=f.level; const w=clamp(f.w||LEVELS[level].w,8,120), h=clamp(f.h||LEVELS[level].h,8,120);
  const m={id:'map-'+uid(),name:f.name||'Mapa',level,plane:curPlane,w,h,scale:f.scale||LEVELS[level].scale,unit:LEVELS[level].unit,t:LEVELS[level].base.repeat(w*h),r:'.'.repeat(w*h),regions:[],labels:[],markers:[],parent:parent?.id||null,created:Date.now()};
  if(f.gen) m.t=generateTerrain(m,(Math.random()*1e6)|0);
  Store.put('maps',m); if(fromMarker&&parent){ fromMarker.link=m.id; Store.put('maps',parent); } md.close(); MS.level=level; if(Ed.map) saveMap(0); openMap(m.id); toast(`Mapa "${m.name}" creado.`); counts(); };
}
let popEl=null;
function closePop(){ if(popEl){ popEl.remove(); popEl=null; } }
function placePop(el,p){ const st=$('#stage'); st.append(el); const W=st.clientWidth,H=st.clientHeight; el.style.left=clamp(p.x+16,8,W-el.offsetWidth-8)+'px'; el.style.top=clamp(p.y-20,8,H-el.offsetHeight-8)+'px'; popEl=el; }
function markerPop(k,p,isNew){
 closePop(); const m=Ed.map, child=LEVELS[m.level].child; const linked=k.link&&Store.get('maps',k.link);
 const el=document.createElement('div'); el.className='pop';
 el.innerHTML=`<input class="inp" id="kn" placeholder="Nombre del lugar" value="${esc(k.name)}" aria-label="Nombre del lugar"><select class="sel" id="kk" aria-label="Tipo">${MARK[m.level].map(([v,t])=>`<option value="${v}" ${v===k.kind?'selected':''}>${t}</option>`).join('')}</select>
  <textarea class="inp" id="knote" rows="3" placeholder="Notas: quién vive aquí, qué esconde…" aria-label="Notas">${esc(k.note||'')}</textarea>
  ${child?(linked?`<button class="btn sm pri" id="kgo">${I.map} Abrir ${esc(linked.name)}</button>`:`<button class="btn sm" id="ksub">${I.plus} Crear mapa ${LEVELS[child].name.toLowerCase()} aquí</button>`):''}
  <div class="row" style="justify-content:space-between"><button class="btn sm danger" id="kdel">${I.trash} Quitar</button><button class="btn sm pri" id="kok">Listo</button></div>`;
 placePop(el,p); if(isNew) setTimeout(()=>$('#kn',el).focus(),30);
 const sync=()=>{ k.name=$('#kn',el).value; k.kind=$('#kk',el).value; k.note=$('#knote',el).value; saveMap(600); requestDraw(); };
 el.addEventListener('input',sync); el.addEventListener('change',sync);
 $('#kn',el).onkeydown=e=>{ if(e.key==='Enter'){ closePop(); } };
 $('#kok',el).onclick=()=>{ sync(); closePop(); Ed.sel=null; requestDraw(); };
 $('#kdel',el).onclick=()=>{ m.markers=m.markers.filter(x=>x!==k); Ed.sel=null; closePop(); saveMap(300); requestDraw(); };
 $('#kgo',el)?.addEventListener('click',()=>{ saveMap(0); openMap(linked.id); });
 $('#ksub',el)?.addEventListener('click',()=>{ sync(); closePop(); newMapDialog(m,k); });
}
function labelPop(l,p,isNew){
 closePop(); const el=document.createElement('div'); el.className='pop';
 el.innerHTML=`<input class="inp" id="ln" value="${esc(l.text)}" aria-label="Texto"><div class="row" style="gap:6px"><small class="muted">Tamaño</small>${[1,1.3,2,3,4].map(s=>`<span class="chip ${l.size===s?'on':''}" data-ls="${s}">${s===1?'S':s===1.3?'M':s===2?'L':s===3?'XL':'XXL'}</span>`).join('')}<label class="chip" style="cursor:pointer"><input type="checkbox" id="lit" ${l.italic?'checked':''}> Cursiva</label></div>
  <div class="row" style="justify-content:space-between"><button class="btn sm danger" id="ldel">${I.trash} Quitar</button><button class="btn sm pri" id="lok">Listo</button></div>`;
 placePop(el,p); if(isNew) setTimeout(()=>{ const i=$('#ln',el); i.focus(); i.select(); },30);
 $('#ln',el).oninput=e=>{ l.text=e.target.value; saveMap(600); requestDraw(); };
 $('#ln',el).onkeydown=e=>{ if(e.key==='Enter') closePop(); };
 $('#lit',el).onchange=e=>{ l.italic=e.target.checked; saveMap(); requestDraw(); };
 $$('[data-ls]',el).forEach(c=>c.onclick=()=>{ l.size=+c.dataset.ls; $$('[data-ls]',el).forEach(x=>x.classList.toggle('on',x===c)); saveMap(); requestDraw(); });
 $('#lok',el).onclick=()=>{ if(!l.text.trim()) Ed.map.labels=Ed.map.labels.filter(x=>x!==l); closePop(); Ed.sel=null; saveMap(300); requestDraw(); };
 $('#ldel',el).onclick=()=>{ Ed.map.labels=Ed.map.labels.filter(x=>x!==l); closePop(); Ed.sel=null; saveMap(300); requestDraw(); };
}
async function exportMap(){
 if(!Ed.map) return; const m=Ed.map; const sc=m.w*m.h>6000?.5:1; const cv=document.createElement('canvas'); cv.width=m.w*C*sc; cv.height=m.h*C*sc; const c=cv.getContext('2d');
 const css=getComputedStyle(document.documentElement); c.fillStyle=css.getPropertyValue('--bg'); c.fillRect(0,0,cv.width,cv.height);
 drawScene(c,cv.width,cv.height,{x:0,y:0,z:sc},{export:true});
 const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
 if(!Store.downloads){ if(window.claude){ toast('Exportar no está disponible en esta vista.','bad'); return; } const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(m.name||'mapa')+'.png'; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Mapa exportado como imagen.'); return; }
 try{ const r=await Store.downloads.save({filename:(m.name||'mapa').replace(/[^\p{L}\p{N} _-]/gu,'')+'.png',data:blob}); if(r&&r.status==='saved') toast('Mapa exportado como imagen.'); }
 catch(e){ if(e&&e.code!=='cancelled'&&e.code!=='declined') toast('No se pudo exportar el mapa.','bad'); }
}
/* ===== Arranque ===== */
const VIEWS={mesa:vMesa,combate:vCombate,personajes:vPersonajes,pnj:vPNJ,mapas:vMapas,wiki:vWiki,bestiario:vMonstruos,hechizos:vHechizos,especies:vEspecies,clases:vClases,dotes:vDotesW,reglas:vReglas,biblioteca:vBiblioteca};
Store.init(); shell(); Ambient.init();
(()=>{ const p=planeById((Store.docs.settings||{}).plane||lsGet('oz:plane','material')); curPlane=p.id; document.documentElement.dataset.plane=p.id; $('#plName').textContent=p.name; Ambient.set(p.fx,p.c); render(); })();
</script></body></html>
